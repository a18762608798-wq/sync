<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" font-family="sans-serif">
<rect x="0" y="0" width="1000" height="620" fill="white"/>
<text x="30" y="30" font-size="20" font-weight="bold">面包板连线还原原理图（按照片估读）</text>
<text x="30" y="52" font-size="13" fill="#555">假设：右端黄线=VCC贯通，蓝线=GND贯通；红线=VCC，绿线=GND；上长线红/蓝/黄=信号；IC型号待确认</text>

<!-- Power rails -->
<line x1="30" y1="90" x2="970" y2="90" stroke="red" stroke-width="3"/>
<text x="975" y="94" font-size="12" fill="red">VCC</text>
<line x1="30" y1="115" x2="970" y2="115" stroke="#1565C0" stroke-width="3"/>
<text x="975" y="119" font-size="12" fill="#1565C0">GND</text>
<line x1="30" y1="540" x2="970" y2="540" stroke="red" stroke-width="3"/>
<text x="975" y="544" font-size="12" fill="red">VCC</text>
<line x1="30" y1="565" x2="970" y2="565" stroke="#1565C0" stroke-width="3"/>
<text x="975" y="569" font-size="12" fill="#1565C0">GND</text>
<!-- right vertical power link -->
<line x1="920" y1="90" x2="920" y2="540" stroke="#F9A825" stroke-width="3"/>
<text x="928" y="320" font-size="12" fill="#F9A825">黄 VCC 上下贯通</text>
<line x1="900" y1="115" x2="900" y2="565" stroke="#1565C0" stroke-width="3"/>
<text x="830" y="340" font-size="12" fill="#1565C0">蓝 GND上下贯通</text>

<!-- Left: pull-up resistors R1-R4 -->
<g font-size="12">
<text x="80" y="140" font-weight="bold">上拉电阻</text>
<!-- R1 -->
<line x1="100" y1="90" x2="100" y2="155" stroke="black" stroke-width="2"/>
<rect x="88" y="155" width="24" height="60" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="92" y="190" font-size="10">R1</text>
<line x1="100" y1="215" x2="100" y2="250" stroke="black" stroke-width="2"/>
<!-- R2 -->
<line x1="130" y1="90" x2="130" y2="155" stroke="black" stroke-width="2"/>
<rect x="118" y="155" width="24" height="60" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="122" y="190" font-size="10">R2</text>
<line x1="130" y1="215" x2="130" y2="250" stroke="black" stroke-width="2"/>
<!-- R3 -->
<line x1="160" y1="90" x2="160" y2="155" stroke="black" stroke-width="2"/>
<rect x="148" y="155" width="24" height="60" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="152" y="190" font-size="10">R3</text>
<line x1="160" y1="215" x2="160" y2="250" stroke="black" stroke-width="2"/>
<!-- R4? 照片疑似3-4只，按4只画，缺的可空 -->
<line x1="190" y1="90" x2="190" y2="155" stroke="black" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="178" y="155" width="24" height="60" fill="#f5f5f5" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
<text x="182" y="190" font-size="10">R4?</text>
<line x1="190" y1="215" x2="190" y2="250" stroke="black" stroke-width="2" stroke-dasharray="5 4"/>
</g>

<!-- DIP switch -->
<rect x="70" y="250" width="150" height="70" fill="#222" stroke="black" stroke-width="2" rx="4"/>
<text x="80" y="270" font-size="11" fill="white">DIP-4 ON KX15</text>
<g font-size="11" fill="white">
<rect x="85" y="280" width="20" height="25" fill="#444" stroke="white"/><text x="90" y="297">1</text>
<rect x="115" y="280" width="20" height="25" fill="#444" stroke="white"/><text x="120" y="297">2</text>
<rect x="145" y="280" width="20" height="25" fill="#444" stroke="white"/><text x="150" y="297">3</text>
<rect x="175" y="280" width="20" height="25" fill="#444" stroke="white"/><text x="180" y="297">4</text>
</g>
<!-- DIP upper to signals + resistors -->
<line x1="95" y1="250" x2="100" y2="250" stroke="black" stroke-width="2"/>
<line x1="100" y1="250" x2="100" y2="250" stroke="black"/>
<line x1="100" y1="250" x2="100" y2="215" stroke="black" stroke-width="2"/>
<line x1="130" y1="250" x2="130" y2="215" stroke="black" stroke-width="2"/>
<line x1="160" y1="250" x2="160" y2="215" stroke="black" stroke-width="2"/>
<line x1="190" y1="250" x2="190" y2="215" stroke="black" stroke-width="2" stroke-dasharray="5 4"/>
<!-- DIP lower to GND -->
<line x1="95" y1="320" x2="95" y2="480" stroke="#2E7D32" stroke-width="3"/>
<line x1="125" y1="320" x2="125" y2="480" stroke="#2E7D32" stroke-width="3"/>
<line x1="155" y1="320" x2="155" y2="480" stroke="#2E7D32" stroke-width="3"/>
<line x1="185" y1="320" x2="185" y2="480" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6 4"/>
<text x="60" y="505" font-size="12" fill="#2E7D32">DIP下端共地 ×3~4绿线到底部GND</text>
<!-- lower GND dots -->
<circle cx="95" cy="565" r="5" fill="#1565C0"/><circle cx="125" cy="565" r="5" fill="#1565C0"/><circle cx="155" cy="565" r="5" fill="#1565C0"/>

<!-- Signal bus to U1 -->
<text x="250" y="235" font-size="12">信号总线（上层红/蓝/黄长线）</text>
<line x1="100" y1="250" x2="350" y2="250" stroke="#F9A825" stroke-width="3"/>
<line x1="130" y1="260" x2="370" y2="260" stroke="#1565C0" stroke-width="3"/>
<line x1="160" y1="270" x2="390" y2="270" stroke="#1565C0" stroke-width="3"/>
<line x1="190" y1="280" x2="410" y2="280" stroke="red" stroke-width="3"/>
<text x="250" y="300" font-size="11" fill="#555">黄=S1 蓝=S2 蓝=S3 红=S4（颜色按照片，实际以列为准，共3~4根）</text>

<!-- U1 middle 16-pin -->
<rect x="350" y="320" width="180" height="120" fill="#111" stroke="black" stroke-width="2"/>
<text x="400" y="390" font-size="14" fill="white">U1</text>
<text x="385" y="410" font-size="11" fill="white">16脚 (中)</text>
<!-- U1 upper pins -->
<circle cx="370" cy="320" r="4" fill="gold"/><circle cx="390" cy="320" r="4" fill="gold"/><circle cx="410" cy="320" r="4" fill="gold"/><circle cx="430" cy="320" r="4" fill="gold"/><circle cx="450" cy="320" r="4" fill="gold"/><circle cx="470" cy="320" r="4" fill="gold"/><circle cx="490" cy="320" r="4" fill="gold"/><circle cx="510" cy="320" r="4" fill="gold"/>
<!-- U1 lower pins -->
<circle cx="370" cy="440" r="4" fill="gold"/><circle cx="390" cy="440" r="4" fill="gold"/><circle cx="410" cy="440" r="4" fill="gold"/><circle cx="430" cy="440" r="4" fill="gold"/><circle cx="450" cy="440" r="4" fill="gold"/><circle cx="470" cy="440" r="4" fill="gold"/><circle cx="490" cy="440" r="4" fill="gold"/><circle cx="510" cy="440" r="4" fill="gold"/>
<!-- U1 upper: signals in + greens to GND -->
<line x1="350" y1="250" x2="350" y2="320" stroke="#F9A825" stroke-width="2"/>
<line x1="370" y1="260" x2="370" y2="320" stroke="#1565C0" stroke-width="2"/>
<line x1="390" y1="270" x2="390" y2="320" stroke="#1565C0" stroke-width="2"/>
<line x1="410" y1="280" x2="410" y2="320" stroke="red" stroke-width="2"/>
<line x1="430" y1="115" x2="430" y2="320" stroke="#2E7D32" stroke-width="3"/>
<line x1="450" y1="115" x2="450" y2="320" stroke="#2E7D32" stroke-width="3"/>
<line x1="470" y1="115" x2="470" y2="320" stroke="#2E7D32" stroke-width="3"/>
<line x1="490" y1="115" x2="490" y2="320" stroke="#2E7D32" stroke-width="3"/>
<line x1="510" y1="115" x2="510" y2="320" stroke="#2E7D32" stroke-width="3"/>
<text x="535" y="220" font-size="11" fill="#2E7D32">上×5绿线到顶GND：空脚接地/接VCC</text>
<!-- U1 lower: greens to GND + VCC red -->
<line x1="370" y1="440" x2="370" y2="565" stroke="#2E7D32" stroke-width="3"/>
<line x1="390" y1="440" x2="390" y2="565" stroke="#2E7D32" stroke-width="3"/>
<line x1="410" y1="440" x2="410" y2="565" stroke="#2E7D32" stroke-width="3"/>
<line x1="430" y1="440" x2="430" y2="565" stroke="#2E7D32" stroke-width="3"/>
<line x1="470" y1="440" x2="470" y2="565" stroke="#2E7D32" stroke-width="3"/>
<line x1="490" y1="440" x2="490" y2="565" stroke="#2E7D32" stroke-width="3"/>
<text x="330" y="505" font-size="11" fill="#2E7D32">下×4+2绿线到底GND</text>
<line x1="510" y1="440" x2="680" y2="440" stroke="red" stroke-width="3"/>
<text x="550" y="430" font-size="11" fill="red">红线 VCC链</text>

<!-- U2 right 14-pin -->
<rect x="620" y="325" width="140" height="110" fill="#111" stroke="black" stroke-width="2"/>
<text x="670" y="388" font-size="14" fill="white">U2</text>
<text x="655" y="408" font-size="11" fill="white">14脚 (右)</text>
<circle cx="640" cy="325" r="4" fill="gold"/><circle cx="660" cy="325" r="4" fill="gold"/><circle cx="680" cy="325" r="4" fill="gold"/><circle cx="700" cy="325" r="4" fill="gold"/><circle cx="720" cy="325" r="4" fill="gold"/><circle cx="740" cy="325" r="4" fill="gold"/>
<circle cx="640" cy="435" r="4" fill="gold"/><circle cx="660" cy="435" r="4" fill="gold"/><circle cx="680" cy="435" r="4" fill="gold"/><circle cx="700" cy="435" r="4" fill="gold"/><circle cx="720" cy="435" r="4" fill="gold"/><circle cx="740" cy="435" r="4" fill="gold"/>
<!-- U2 power -->
<line x1="680" y1="440" x2="680" y2="435" stroke="red" stroke-width="3"/>
<line x1="680" y1="435" x2="820" y2="435" stroke="red" stroke-width="3"/>
<text x="720" y="455" font-size="11" fill="red">红线VCC延续</text>
<line x1="740" y1="435" x2="740" y2="565" stroke="#2E7D32" stroke-width="3"/>
<text x="745" y="505" font-size="11" fill="#2E7D32">绿到GND</text>
<line x1="660" y1="325" x2="660" y2="115" stroke="#2E7D32" stroke-width="3"/>
<text x="560" y="160" font-size="11" fill="#2E7D32">上绿到顶GND</text>
<!-- R5 top right -->
<line x1="840" y1="90" x2="840" y2="150" stroke="black" stroke-width="2"/>
<rect x="828" y="150" width="24" height="50" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="830" y="180" font-size="10">R5</text>
<line x1="840" y1="200" x2="840" y2="260" stroke="black" stroke-width="2"/>
<text x="850" y="230" font-size="11">右上拉(?)，下端进上端子区，悬空/接U2</text>

<text x="30" y="600" font-size="12" fill="#555">注：照片分辨率/角度限制，列号为估读；U1-U2间除电源红线外未见信号跨接，右侧U2信号侧基本空置，疑为待接/双实验共板。提供IC印字可细化到引脚号。</text>
</svg>