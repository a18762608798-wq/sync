                  - text: .
                  - superscript [ref=f17e1503]:
                    - link "[11]" [ref=f17e1504] [cursor=pointer]:
                      - /url: "#cite_note-chkx-11"
                - text: It is an important
                - link "open problem" [ref=f17e1505] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Open_problem
                - text: "in this area whether this implication can be reversed: does W[1] ≠ FPT imply the exponential time hypothesis? There is a hierarchy of parameterized complexity classes called the M-hierarchy that interleaves the W-hierarchy in the sense that, for"
