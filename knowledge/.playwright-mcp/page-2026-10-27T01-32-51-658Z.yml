                      - generic [ref=f17e1497]: <
                      - generic [ref=f17e1498]: "1"
                  - text: ","
                - text: and if the best possible running time for 3-SAT were of this form, then P would be unequal to NP (because 3-SAT is NP-complete and this time bound is not polynomial) but the exponential time hypothesis would be false.
              - paragraph [ref=f17e1500]:
                - text: In parameterized complexity theory, because the exponential time hypothesis implies that there does not exist a fixed-parameter-tractable algorithm for maximum clique, it also implies that
                - generic [ref=f17e1501]:
