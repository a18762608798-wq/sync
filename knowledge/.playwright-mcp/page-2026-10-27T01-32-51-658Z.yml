                      - generic [ref=f17e1421]:
                        - generic [ref=f17e1422]: o
                        - generic [ref=f17e1423]: (
                        - generic [ref=f17e1424]: m
                        - generic [ref=f17e1425]: )
                  - text: computation,
                - text: it could be transformed into an algorithm for solving
                - generic [ref=f17e1427]:
                  - math [ref=f17e1430]:
                    - generic [ref=f17e1431]: k
                  - text: "-SAT"
                - text: in
                - generic [ref=f17e1436]:
                  - text: time
