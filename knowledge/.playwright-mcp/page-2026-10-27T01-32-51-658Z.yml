                - heading "Communication complexity" [level=3] [ref=f17e1371]
                - link "edit" [ref=f17e1373] [cursor=pointer]:
                  - /url: /w/index.php?title=Exponential_time_hypothesis&action=edit&section=5
              - paragraph [ref=f17e1374]:
                - text: In the three-party set
                - link "disjointness" [ref=f17e1375] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Disjointness
                - text: problem in
                - link "communication complexity" [ref=f17e1376] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Communication_complexity
                - text: ", three subsets of the integers in some"
                - generic [ref=f17e1377]:
                  - text: range
                  - math [ref=f17e1380]:
                    - generic [ref=f17e1383]:
                      - generic [ref=f17e1384]: "["
                      - generic [ref=f17e1385]: "1"
                      - generic [ref=f17e1386]: ","
                      - generic [ref=f17e1387]: m
                      - generic [ref=f17e1388]: "]"
                - text: are specified, and three communicating parties each know two of the three subsets. The goal is for the parties to transmit as few bits to each other on a shared communications channel in order for one of the parties to be able to determine whether the intersection of the three sets is empty or nonempty. A trivial
                - generic [ref=f17e1390]:
                  - math [ref=f17e1393]:
                    - generic [ref=f17e1394]: m
                  - text: "-bit"
                - text: communications protocol would be for one of the three parties to transmit a
                - link "bitvector" [ref=f17e1399] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bitvector
                - text: describing the intersection of the two sets known to that party, after which either of the two remaining parties can determine the emptiness of the intersection. However, if there exists a protocol that solves the problem with
                - generic [ref=f17e1400]:
                  - math [ref=f17e1403]:
                    - generic [ref=f17e1406]:
                      - generic [ref=f17e1407]: o
                      - generic [ref=f17e1408]: (
