              - paragraph [ref=f17e1607]:
                - text: It is also possible to prove implications in the other direction, from the failure of a variation of the strong exponential time hypothesis to separations of complexity classes. As
                - link "Williams (2010)" [ref=f17e1608] [cursor=pointer]:
                  - /url: "#CITEREFWilliams2010"
                - text: shows, if there exists an algorithm
                - math [ref=f17e1611]:
                  - generic [ref=f17e1612]: A
                - text: that solves
                - link "Boolean circuit" [ref=f17e1617] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Boolean_circuit
                - text: satisfiability in time
                - math [ref=f17e1620]:
