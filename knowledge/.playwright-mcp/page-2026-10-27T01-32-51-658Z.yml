            - region [ref=f17e1463]:
              - generic [ref=f17e1464]:
                - heading "Structural complexity" [level=3] [ref=f17e1465]
                - link "edit" [ref=f17e1467] [cursor=pointer]:
                  - /url: /w/index.php?title=Exponential_time_hypothesis&action=edit&section=6
              - paragraph [ref=f17e1468]:
                - text: If the exponential time hypothesis is true, then 3-SAT would not have a polynomial time algorithm, and therefore it would follow that
                - link "P ≠ NP" [ref=f17e1469] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/P_versus_NP_problem
                - text: . More strongly, in this case, 3-SAT could not even have a
                - link "quasi-polynomial time" [ref=f17e1470] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Quasi-polynomial_time
                - text: algorithm, so NP could not be a subset of QP. However, if the exponential time hypothesis fails, it would have no implication for the P versus NP problem. A
                - link "padding argument" [ref=f17e1471] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Padding_argument
                - text: proves the existence of NP-complete problems for which the best known running times have the form
                - math [ref=f17e1474]:
                  - generic [ref=f17e1477]:
                    - generic [ref=f17e1478]: O
                    - generic [ref=f17e1479]: (
                    - generic [ref=f17e1480]:
