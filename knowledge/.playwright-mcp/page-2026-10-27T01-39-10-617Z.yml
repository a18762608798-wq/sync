                  - heading "How the results were produced" [level=2] [ref=f49e455]
                  - 'link "Permalink: How the results were produced" [ref=f49e456] [cursor=pointer]':
                    - /url: "#how-the-results-were-produced"
                - paragraph [ref=f49e459]: The vast majority of results were obtained with the same procedure using an unreleased internal OpenAI model. On average, each result used three hours of ChatGPT Pro thinking compute with that model. Over the course of the evaluation, the model was posed approximately 4,000 problems. Aggregating the output into result families and manuscripts and requiring an appropriate level of significance led to the catalog outlined above.
                - paragraph [ref=f49e460]: Exceptions to this fixed procedure include work on a zero-free region for the Riemann zeta function and proof of the Hodge Conjecture for CM abelian varieties. Additionally, the writeup for the Re(s) > 11/12 zero-free region for the Riemann zeta function was human edited for readability.
