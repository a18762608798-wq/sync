              - article [ref=f49e370]:
                - generic [ref=f49e371]:
                  - heading "Readme" [level=1] [ref=f49e372]
                  - 'link "Permalink: Readme" [ref=f49e373] [cursor=pointer]':
                    - /url: "#readme"
                - paragraph [ref=f49e376]: This repository contains mathematical manuscripts and supporting proof artifacts produced by an unnamed internal OpenAI model.
                - paragraph [ref=f49e377]: As part of model development, we evaluate our models on open research problems. We expanded these evaluations after performance on our existing mathematical evaluations saturated. Some outputs build upon earlier results produced by the models.
                - paragraph [ref=f49e378]: This collection includes results at different stages of verification. Not all have accompanying Lean formalizations. We will continue to update this repository with Lean formalizations as we obtain them.
                - paragraph [ref=f49e379]: Some of the unformalized results could have issues. We will endeavor to fix any such issues quickly. We are also exploring community-hosted repositories for these materials.
                - paragraph [ref=f49e380]: In our view, these manuscripts are best understood as a form of raw research data, rather than polished academic papers. We defer to the math community completely on matters of credit, precedence, and concurrent work.
                - generic [ref=f49e381]:
                  - heading "Navigating the collection" [level=2] [ref=f49e382]
                  - 'link "Permalink: Navigating the collection" [ref=f49e383] [cursor=pointer]':
                    - /url: "#navigating-the-collection"
                - paragraph [ref=f49e386]: The current catalogue contains 721 manuscripts organized into 373 families. A family groups related papers, which may include a principal result, companion arguments, consequences, or alternative proofs. Each family is classified by mathematical discipline.
                - list [ref=f49e387]:
                  - listitem [ref=f49e388]:
                    - text: Start with the
                    - link "overview" [ref=f49e389] [cursor=pointer]:
