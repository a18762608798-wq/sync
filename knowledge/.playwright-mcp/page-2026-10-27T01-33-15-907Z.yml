              - text: ":"
              - generic [ref=f19e425]: Táo Zhéxuān
              - text: ;
              - superscript [ref=f19e426]:
                - link "[4]" [ref=f19e427] [cursor=pointer]:
                  - /url: "#cite_note-whoami-4"
              - text: born 17 July 1975) is an Australian-American mathematician and professor of mathematics at the
              - link "University of California, Los Angeles" [ref=f19e428] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/University_of_California,_Los_Angeles
              - text: (UCLA). He was awarded the
              - link "Fields Medal" [ref=f19e429] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fields_Medal
              - text: in 2006 for his contributions to
              - link "partial differential equations" [ref=f19e430] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Partial_differential_equation
              - text: ","
              - link "combinatorics" [ref=f19e431] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Combinatorics
              - text: ","
              - link "harmonic analysis" [ref=f19e432] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Harmonic_analysis
              - text: ", and"
              - link "additive number theory" [ref=f19e433] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Additive_number_theory
              - text: . Among his best-known results is the
              - link "Green–Tao theorem" [ref=f19e434] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Green–Tao_theorem
              - text: ", proved with"
              - link "Ben Green" [ref=f19e435] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ben_Green_(mathematician)
              - text: ", which states that the"
              - link "prime numbers" [ref=f19e436] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prime_number
              - text: contain arbitrarily long arithmetic progressions.
            - paragraph [ref=f19e437]:
              - text: Tao was born to Chinese immigrant parents and raised in
              - link "Adelaide" [ref=f19e438] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Adelaide
              - text: ", South Australia. After earning his doctorate in mathematics from"
              - link "Princeton University" [ref=f19e439] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Princeton_University
              - text: and joining the faculty at UCLA, he went on to be a researcher, known for the diversity of his own interests and his collaborations with others. Tao has won many prizes for his work, including the
              - link "Fields Medal" [ref=f19e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fields_Medal
              - text: in 2006 and the
              - link "Royal Medal" [ref=f19e441] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Royal_Medal
              - text: and
              - link "Breakthrough Prize in Mathematics" [ref=f19e442] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Breakthrough_Prize_in_Mathematics
              - text: in 2014. He is a
              - link "2006 MacArthur Fellow" [ref=f19e443] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MacArthur_Fellows_Program
              - text: .
              - superscript [ref=f19e444]:
                - link "[5]" [ref=f19e445] [cursor=pointer]:
                  - /url: "#cite_note-singmind-5"
              - superscript [ref=f19e446]:
                - link "[6]" [ref=f19e447] [cursor=pointer]:
                  - /url: "#cite_note-6"
              - superscript [ref=f19e448]:
                - link "[7]" [ref=f19e449] [cursor=pointer]:
                  - /url: "#cite_note-Terence_Tao:_the_Mozart_of_maths-7"
            - paragraph [ref=f19e450]:
              - text: Tao's published research includes topics in
              - link "harmonic analysis" [ref=f19e451] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Harmonic_analysis
              - text: ","
              - link "partial differential equations" [ref=f19e452] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Partial_differential_equation
              - text: ","
              - link "algebraic combinatorics" [ref=f19e453] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Algebraic_combinatorics
              - text: ","
              - link "arithmetic combinatorics" [ref=f19e454] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Arithmetic_combinatorics
              - text: ","
              - link "geometric combinatorics" [ref=f19e455] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Geometric_combinatorics
              - text: ","
              - link "probability theory" [ref=f19e456] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Probability_theory
              - text: ","
              - link "compressed sensing" [ref=f19e457] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Compressed_sensing
              - text: ", and"
              - link "analytic number theory" [ref=f19e458] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Analytic_number_theory
              - text: .
              - superscript [ref=f19e459]:
                - link "[8]" [ref=f19e460] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - text: He is regarded by many as "the finest mathematician of his generation".
              - superscript [ref=f19e461]:
                - link "[5]" [ref=f19e462] [cursor=pointer]:
                  - /url: "#cite_note-singmind-5"
          - region [ref=f19e463]:
            - generic [ref=f19e464]:
              - heading "Early life and career" [level=2] [ref=f19e465]
              - link "edit" [ref=f19e467] [cursor=pointer]:
                - /url: /w/index.php?title=Terence_Tao&action=edit&section=1
            - region [ref=f19e468]:
              - generic [ref=f19e469]:
                - heading "Family" [level=3] [ref=f19e470]
                - link "edit" [ref=f19e472] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=2
              - paragraph [ref=f19e473]:
                - text: Tao's father, Billy Tao,
                - superscript [ref=f19e474]:
                  - link "[a]" [ref=f19e475] [cursor=pointer]:
                    - /url: "#cite_note-9"
                - text: was a Chinese
                - link "paediatrician" [ref=f19e476] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pediatrics
                - text: who was born in
                - link "Shanghai" [ref=f19e477] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Shanghai
                - text: and received a medical degree (
                - link "MBBS" [ref=f19e478] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/MBBS
                - text: ) from the
                - link "University of Hong Kong" [ref=f19e479] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/University_of_Hong_Kong
                - text: in 1969.
                - superscript [ref=f19e480]:
                  - link "[9]" [ref=f19e481] [cursor=pointer]:
                    - /url: "#cite_note-10"
                - text: Tao's mother, Grace Leong,
                - superscript [ref=f19e482]:
                  - link "[b]" [ref=f19e483] [cursor=pointer]:
                    - /url: "#cite_note-11"
                - text: was born in Hong Kong; she received a first-class honours bachelor's degree majoring in
                - link "mathematics" [ref=f19e484] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mathematics
                - text: and
                - link "physics" [ref=f19e485] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Physics
                - text: from the University of Hong Kong.
                - superscript [ref=f19e486]:
                  - link "[7]" [ref=f19e487] [cursor=pointer]:
                    - /url: "#cite_note-Terence_Tao:_the_Mozart_of_maths-7"
                - text: She was a secondary school teacher of mathematics and physics in Hong Kong.
                - superscript [ref=f19e488]:
                  - link "[10]" [ref=f19e489] [cursor=pointer]:
                    - /url: "#cite_note-12"
                - superscript [ref=f19e490]:
                  - link "[11]" [ref=f19e491] [cursor=pointer]:
                    - /url: "#cite_note-13"
                - text: Billy and Grace met as students at the University of Hong Kong.
                - superscript [ref=f19e492]:
                  - link "[12]" [ref=f19e493] [cursor=pointer]:
                    - /url: "#cite_note-14"
                - text: They then emigrated from Hong Kong to Australia in 1972.
                - superscript [ref=f19e494]:
                  - link "[7]" [ref=f19e495] [cursor=pointer]:
                    - /url: "#cite_note-Terence_Tao:_the_Mozart_of_maths-7"
                - superscript [ref=f19e496]:
                  - link "[13]" [ref=f19e497] [cursor=pointer]:
                    - /url: "#cite_note-ReferenceA-15"
              - paragraph [ref=f19e498]:
                - text: Tao also has two brothers,
                - link "Trevor" [ref=f19e499] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trevor_Tao
                - text: and Nigel, who are currently living in Australia. Both formerly represented Australia at the
                - link "International Mathematical Olympiad" [ref=f19e500] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Mathematical_Olympiad
                - text: .
                - superscript [ref=f19e501]:
                  - link "[14]" [ref=f19e502] [cursor=pointer]:
                    - /url: "#cite_note-NigelIMO-16"
                - superscript [ref=f19e503]:
                  - link "[15]" [ref=f19e504] [cursor=pointer]:
                    - /url: "#cite_note-TrevorIMO-17"
            - region [ref=f19e505]:
              - generic [ref=f19e506]:
                - heading "Childhood" [level=3] [ref=f19e507]
                - link "edit" [ref=f19e509] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=3
              - paragraph [ref=f19e510]:
                - text: A
                - link "child prodigy" [ref=f19e511] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Child_prodigy
                - text: ","
                - superscript [ref=f19e512]:
                  - link "[16]" [ref=f19e513] [cursor=pointer]:
                    - /url: "#cite_note-18"
                - text: Terence Tao skipped five grades in primary school.
                - superscript [ref=f19e514]:
                  - link "[17]" [ref=f19e515] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - superscript [ref=f19e516]:
                  - link "[18]" [ref=f19e517] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: He commenced at
                - link "Blackwood High School" [ref=f19e518] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Blackwood_High_School
                - text: aged 7, completing Year 11 and 12 maths and physics while studying Year 8 biology and chemistry.
                - superscript [ref=f19e519]:
                  - link "[19]" [ref=f19e520] [cursor=pointer]:
                    - /url: "#cite_note-21"
                - superscript [ref=f19e521]:
                  - link "[20]" [ref=f19e522] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - text: Tao exhibited extraordinary mathematical abilities from an early age, attending university-level mathematics courses at the age of 9. He is one of only three children in the history of the Johns Hopkins
                - link "Study of Exceptional Talent" [ref=f19e523] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Study_of_Exceptional_Talent
                - text: program to have achieved a score of 700 or greater on the
                - link "SAT" [ref=f19e524] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SAT
                - text: math section while just eight years old; Tao scored a 760.
                - superscript [ref=f19e525]:
                  - link "[21]" [ref=f19e526] [cursor=pointer]:
                    - /url: "#cite_note-23"
                - link "Julian Stanley" [ref=f19e527] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Julian_Stanley
                - text: ", Director of the"
                - link "Study of Mathematically Precocious Youth" [ref=f19e528] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Study_of_Mathematically_Precocious_Youth
                - text: ", stated that Tao had the greatest mathematical reasoning ability he had found in years of intensive searching."
                - superscript [ref=f19e529]:
                  - link "[5]" [ref=f19e530] [cursor=pointer]:
                    - /url: "#cite_note-singmind-5"
                - superscript [ref=f19e531]:
                  - link "[22]" [ref=f19e532] [cursor=pointer]:
                    - /url: "#cite_note-24"
              - paragraph [ref=f19e533]:
                - text: Tao was the
                - link "youngest participant" [ref=f19e534] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_International_Mathematical_Olympiad_participants
                - text: to date in the
                - link "International Mathematical Olympiad" [ref=f19e535] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Mathematical_Olympiad
                - text: ", first competing at the age of ten; in 1986, 1987, and 1988, he won a bronze, silver, and gold medal, respectively. Tao remains the youngest winner of each of the three medals in the Olympiad's history."
                - superscript [ref=f19e536]:
                  - link "[23]" [ref=f19e537] [cursor=pointer]:
                    - /url: "#cite_note-25"
            - region [ref=f19e538]:
              - generic [ref=f19e539]:
                - heading "Career" [level=3] [ref=f19e540]
                - link "edit" [ref=f19e542] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=4
              - paragraph [ref=f19e543]:
                - text: At age 14, Tao attended the
                - link "Research Science Institute" [ref=f19e544] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Research_Science_Institute
                - text: ", a summer program for secondary students. In 1991, he received his bachelor's and master's degrees at the age of 16 from"
                - link "Flinders University" [ref=f19e545] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flinders_University
                - text: under the direction of Garth Gaudry.
                - superscript [ref=f19e546]:
                  - link "[24]" [ref=f19e547] [cursor=pointer]:
                    - /url: "#cite_note-theage.com.au-26"
                - text: In 1992, he won a postgraduate
                - link "Fulbright Scholarship" [ref=f19e548] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fulbright_Scholarship
                - text: to undertake research in mathematics at
                - link "Princeton University" [ref=f19e549] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Princeton_University
                - text: in the United States. From 1992 to 1996, Tao was a graduate student at Princeton University under the direction of
                - link "Elias Stein" [ref=f19e550] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Elias_Stein
                - text: ", receiving his PhD at the age of 21."
                - superscript [ref=f19e551]:
                  - link "[24]" [ref=f19e552] [cursor=pointer]:
                    - /url: "#cite_note-theage.com.au-26"
                - text: In 1996, he joined the faculty of the
                - link "University of California, Los Angeles" [ref=f19e553] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/University_of_California,_Los_Angeles
                - text: . In 1999, when he was 24, he was promoted to full professor at UCLA and remains the youngest person ever appointed to that rank by the institution.
                - superscript [ref=f19e554]:
                  - link "[24]" [ref=f19e555] [cursor=pointer]:
                    - /url: "#cite_note-theage.com.au-26"
              - paragraph [ref=f19e556]:
                - text: He became known for fruitful collaborations and working in multiple specializations; by 2006, Tao had co-authored publications with over 30 other researchers,
                - superscript [ref=f19e557]:
                  - link "[5]" [ref=f19e558] [cursor=pointer]:
                    - /url: "#cite_note-singmind-5"
                - text: reaching 68 co-authors by October 2015.
              - paragraph [ref=f19e559]:
                - text: Tao has had a particularly extensive collaboration with British mathematician
                - link "Ben J. Green" [ref=f19e560] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ben_J._Green
                - text: ; together they proved the
                - link "Green–Tao theorem" [ref=f19e561] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Green–Tao_theorem
                - text: ", which is well known among both amateur and professional mathematicians. This theorem states that there are arbitrarily long"
                - link "arithmetic progressions" [ref=f19e562] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arithmetic_progression
                - text: of
                - link "prime numbers" [ref=f19e563] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Prime_number
                - text: .
                - link "The New York Times" [ref=f19e565] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_New_York_Times
                - text: "described it this way:"
                - superscript [ref=f19e566]:
                  - link "[25]" [ref=f19e567] [cursor=pointer]:
                    - /url: "#cite_note-27"
                - superscript [ref=f19e568]:
                  - link "[26]" [ref=f19e569] [cursor=pointer]:
                    - /url: "#cite_note-28"
              - blockquote [ref=f19e570]:
                - paragraph [ref=f19e571]:
                  - text: In 2004, Dr. Tao, along with Ben Green, a mathematician now at the University of Oxford in England, solved a problem related to the
                  - link "Twin Prime Conjecture" [ref=f19e572] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Twin_Prime_Conjecture
                  - text: by looking at prime number progressions—series of numbers equally spaced. (For example, 3, 7 and 11 constitute a progression of prime numbers with a spacing of 4; the next number in the sequence, 15, is not prime.) Dr. Tao and Dr. Green proved that it is always possible to find, somewhere in the infinity of integers, a progression of prime numbers of equal spacing and any length.
              - paragraph [ref=f19e573]: "Many other results of Tao have received mainstream attention in the scientific press, including:"
              - list [ref=f19e574]:
                - listitem [ref=f19e575]:
                  - text: his establishment of finite time blowup for a modification of the
                  - link "Navier–Stokes existence and smoothness" [ref=f19e576] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Navier–Stokes_existence_and_smoothness
                  - link "Millennium Problem" [ref=f19e577] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Millennium_Prize_Problems
                  - superscript [ref=f19e578]:
                    - link "[27]" [ref=f19e579] [cursor=pointer]:
                      - /url: "#cite_note-quantanavier-29"
                - listitem [ref=f19e580]:
                  - text: his 2015 resolution of the
                  - link "Erdős discrepancy problem" [ref=f19e581] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Erdős_discrepancy_problem
                  - text: ", which used entropy estimates within"
                  - link "analytic number theory" [ref=f19e582] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Analytic_number_theory
                  - superscript [ref=f19e583]:
                    - link "[28]" [ref=f19e584] [cursor=pointer]:
                      - /url: "#cite_note-30"
                - listitem [ref=f19e585]:
                  - text: his 2019 progress on the
                  - link "Collatz conjecture" [ref=f19e586] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Collatz_conjecture
                  - text: ", in which he proved the probabilistic claim that almost all Collatz orbits attain almost bounded values."
                  - superscript [ref=f19e587]:
                    - link "[29]" [ref=f19e588] [cursor=pointer]:
                      - /url: "#cite_note-31"
              - paragraph [ref=f19e589]:
                - text: Tao has also resolved or made progress on a number of conjectures. In 2012, Green and Tao announced proofs of the conjectured "
                - link "orchard-planting problem" [ref=f19e590] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Orchard-planting_problem
                - text: ",\" which asks for the maximum number of lines through exactly three points in a set of n points in the plane, not all on a line. In 2018, with Brad Rodgers, Tao showed that the"
                - link "de Bruijn–Newman constant" [ref=f19e591] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/De_Bruijn–Newman_constant
                - text: ", the nonpositivity of which is equivalent to the"
                - link "Riemann hypothesis" [ref=f19e592] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Riemann_hypothesis
                - text: ", is nonnegative."
                - superscript [ref=f19e593]:
                  - link "[30]" [ref=f19e594] [cursor=pointer]:
                    - /url: "#cite_note-32"
                - text: In 2020, Tao proved
                - link "Sendov's conjecture" [ref=f19e595] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sendov's_conjecture
                - text: ", concerning the locations of the roots and critical points of a complex polynomial, in the special case of polynomials with sufficiently high"
                - link "degree" [ref=f19e596] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Degree_of_a_polynomial
                - text: .
                - superscript [ref=f19e597]:
                  - link "[31]" [ref=f19e598] [cursor=pointer]:
                    - /url: "#cite_note-33"
                - text: In 2024 and 2025, Tao solved problems 121, 442, 135, 685, 69, and 1102 from the Erdős problems website.
                - superscript [ref=f19e599]:
                  - link "[32]" [ref=f19e600] [cursor=pointer]:
                    - /url: "#cite_note-34"
            - region [ref=f19e601]:
              - generic [ref=f19e602]:
                - heading "Recognition" [level=3] [ref=f19e603]
                - link "edit" [ref=f19e605] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=5
              - figure "Tao at ICM 2006" [ref=f19e606]:
                - link [ref=f19e607] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Terence_Tao.jpg
              - paragraph [ref=f19e610]:
                - text: Tao has won numerous awards and mathematician honours over the years.
                - superscript [ref=f19e611]:
                  - link "[33]" [ref=f19e612] [cursor=pointer]:
                    - /url: "#cite_note-35"
                - text: He was appointed a
                - link "Companion of the Order of Australia" [ref=f19e613] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Order_of_Australia
                - text: in the
                - link "2026 King's Birthday Honours" [ref=f19e614] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2026_King's_Birthday_Honours_(Australia)
                - text: for "eminent service to the mathematical sciences, to the global mathematics community, and to tertiary education and academia".
                - superscript [ref=f19e615]:
                  - link "[34]" [ref=f19e616] [cursor=pointer]:
                    - /url: "#cite_note-Companion-36"
                - text: He is a
                - link "Fellow of the Royal Society" [ref=f19e617] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fellow_of_the_Royal_Society
                - text: ", the"
                - link "Australian Academy of Science" [ref=f19e618] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Australian_Academy_of_Science
                - text: (Corresponding Member), the
                - link "National Academy of Sciences" [ref=f19e619] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/National_Academy_of_Sciences
                - text: (Foreign member), the
                - link "American Academy of Arts and Sciences" [ref=f19e620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/American_Academy_of_Arts_and_Sciences
                - text: ", the"
                - link "American Philosophical Society" [ref=f19e621] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/American_Philosophical_Society
                - text: ","
                - superscript [ref=f19e622]:
                  - link "[35]" [ref=f19e623] [cursor=pointer]:
                    - /url: "#cite_note-37"
                - text: and the
                - link "American Mathematical Society" [ref=f19e624] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/American_Mathematical_Society
                - text: .
                - superscript [ref=f19e625]:
                  - link "[36]" [ref=f19e626] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - text: In 2006 he received the
                - link "Fields Medal" [ref=f19e627] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fields_Medal
                - text: ; he was the first Australian, the first
                - link "UCLA" [ref=f19e628] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/UCLA
                - text: faculty member, and one of the youngest mathematicians to receive the award.
                - superscript [ref=f19e629]:
                  - link "[37]" [ref=f19e630] [cursor=pointer]:
                    - /url: "#cite_note-2006_Fields_Medals_awarded-39"
                - superscript [ref=f19e631]:
                  - link "[38]" [ref=f19e632] [cursor=pointer]:
                    - /url: "#cite_note-cbc.ca-40"
                - text: He was also awarded the
                - link "MacArthur Fellowship" [ref=f19e633] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/MacArthur_Fellowship
                - text: . In 2014, Tao was selected as one of the inaugural
                - link "Breakthrough Prize" [ref=f19e634] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Breakthrough_Prize_in_Mathematics
                - text: laureates; he felt himself unqualified and unsuccessfully argued that the prize money be distributed among more researchers instead.
                - superscript [ref=f19e635]:
                  - link "[39]" [ref=f19e636] [cursor=pointer]:
                    - /url: "#cite_note-41"
                - text: After receiving the prize money, he used part of it to establish fellowships for students.
                - superscript [ref=f19e637]:
                  - link "[7]" [ref=f19e638] [cursor=pointer]:
                    - /url: "#cite_note-Terence_Tao:_the_Mozart_of_maths-7"
                - text: In 2019, Tao was chosen as the inaugural winner of the
                - link "Riemann Prize" [ref=f19e639] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Riemann_Prize
                - text: by the Riemann International School of Mathematics at the
                - link "University of Insubria" [ref=f19e640] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/University_of_Insubria
                - text: .
                - superscript [ref=f19e641]:
                  - link "[40]" [ref=f19e642] [cursor=pointer]:
                    - /url: "#cite_note-rism-42"
                - superscript [ref=f19e643]:
                  - link "[41]" [ref=f19e644] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - superscript [ref=f19e645]:
                  - link "[42]" [ref=f19e646] [cursor=pointer]:
                    - /url: "#cite_note-44"
              - paragraph [ref=f19e647]:
                - text: He has been featured in
                - link "The New York Times" [ref=f19e649] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_New_York_Times
                - text: ","
                - link "CNN" [ref=f19e650] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/CNN
                - text: ","
                - link "USA Today" [ref=f19e652] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/USA_Today
                - text: ","
                - link "Popular Science" [ref=f19e654] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Popular_Science
                - text: ", and many other media outlets."
                - superscript [ref=f19e655]:
                  - link "[43]" [ref=f19e656] [cursor=pointer]:
                    - /url: "#cite_note-45"
                - text: Tao was a finalist to become
                - link "Australian of the Year" [ref=f19e657] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Australian_of_the_Year
                - text: in 2007.
                - superscript [ref=f19e658]:
                  - link "[44]" [ref=f19e659] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - text: In 2014, Tao received a CTY Distinguished Alumni Honor from
                - link "Johns Hopkins Center for Gifted and Talented Youth" [ref=f19e660] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Center_for_Talented_Youth
                - text: in front of 979 attendees in 8th and 9th grade who were in the same program from which Tao graduated. In 2021, President
                - link "Joe Biden" [ref=f19e661] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Joe_Biden
                - text: announced Tao had been selected as one of 30 members of his
                - link "President's Council of Advisors on Science and Technology" [ref=f19e662] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/President's_Council_of_Advisors_on_Science_and_Technology
                - text: ", a body bringing together America's most distinguished leaders in science and technology."
                - superscript [ref=f19e663]:
                  - link "[45]" [ref=f19e664] [cursor=pointer]:
                    - /url: "#cite_note-47"
              - paragraph [ref=f19e665]:
                - text: As of 2026, Tao had published 560 articles, along with 19 books.
                - superscript [ref=f19e666]:
                  - link "[46]" [ref=f19e667] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - text: He has an
                - link "Erdős number" [ref=f19e668] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Erdős_number
                - text: of 2
                - superscript [ref=f19e669]:
                  - link "[4]" [ref=f19e670] [cursor=pointer]:
                    - /url: "#cite_note-whoami-4"
                - text: and is a
                - link "highly cited researcher" [ref=f19e671] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Highly_Cited_Researcher
                - text: .
                - superscript [ref=f19e672]:
                  - link "[47]" [ref=f19e673] [cursor=pointer]:
                    - /url: "#cite_note-49"
                - superscript [ref=f19e674]:
                  - link "[48]" [ref=f19e675] [cursor=pointer]:
                    - /url: "#cite_note-50"
              - paragraph [ref=f19e676]:
                - text: Per the New York Times, "many regard Tao as the finest mathematician of his generation."
                - superscript [ref=f19e677]:
                  - link "[5]" [ref=f19e678] [cursor=pointer]:
                    - /url: "#cite_note-singmind-5"
                - text: An article by
                - link "New Scientist" [ref=f19e680] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_Scientist
                - superscript [ref=f19e681]:
                  - link "[49]" [ref=f19e682] [cursor=pointer]:
                    - /url: "#cite_note-51"
                - text: "writes of his ability:"
              - blockquote [ref=f19e683]:
                - paragraph [ref=f19e684]:
                  - text: Such is Tao's reputation that mathematicians now compete to interest him in their problems, and he is becoming a kind of Mr. Fix-it for frustrated researchers. "If you're stuck on a problem, then one way out is to interest Terence Tao," says Professor of Mathematics at Princeton University
                  - link "Charles Fefferman" [ref=f19e685] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Charles_Fefferman
                  - text: .
                  - superscript [ref=f19e686]:
                    - link "[37]" [ref=f19e687] [cursor=pointer]:
                      - /url: "#cite_note-2006_Fields_Medals_awarded-39"
              - paragraph [ref=f19e688]:
                - text: British mathematician and Fields medalist
                - link "Timothy Gowers" [ref=f19e689] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Timothy_Gowers
                - text: "remarked on Tao's breadth of knowledge:"
                - superscript [ref=f19e690]:
                  - link "[50]" [ref=f19e691] [cursor=pointer]:
                    - /url: "#cite_note-52"
              - blockquote [ref=f19e692]:
                - paragraph [ref=f19e693]:
                  - text: "Tao's mathematical knowledge has an extraordinary combination of breadth and depth: he can write confidently and authoritatively on topics as diverse as partial differential equations, analytic number theory, the geometry of 3-manifolds, nonstandard analysis, group theory, model theory, quantum mechanics, probability, ergodic theory, combinatorics, harmonic analysis, image processing, functional analysis, and many others. Some of these are areas to which he has made fundamental contributions. Others are areas that he appears to understand at the deep intuitive level of an expert despite officially not working in those areas. How he does all this, as well as writing papers and books at a prodigious rate, is a complete mystery. It has been said that"
                  - link "David Hilbert" [ref=f19e694] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/David_Hilbert
                  - text: was the last person to know all of mathematics, but it is not easy to find gaps in Tao's knowledge, and if you do then you may well find that the gaps have been filled a year later.
          - region [ref=f19e695]:
            - generic [ref=f19e696]:
              - heading "Research contributions" [level=2] [ref=f19e697]
              - link "edit" [ref=f19e699] [cursor=pointer]:
                - /url: /w/index.php?title=Terence_Tao&action=edit&section=6
            - region [ref=f19e700]:
              - generic [ref=f19e701]:
                - heading "Dispersive partial differential equations" [level=3] [ref=f19e702]
                - link "edit" [ref=f19e704] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=7
              - paragraph [ref=f19e705]:
                - text: From 2001 to 2010, Tao was part of a collaboration with
                - link "James Colliander" [ref=f19e706] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/James_Colliander
                - text: ", Markus Keel,"
                - link "Gigliola Staffilani" [ref=f19e707] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gigliola_Staffilani
                - text: ", and Hideo Takaoka. They found a number of novel results, many to do with the"
                - link "well-posedness" [ref=f19e708] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Well-posed_problem
                - text: of
                - link "weak solutions" [ref=f19e709] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Weak_solution
                - text: ", for"
                - link "Schrödinger equations" [ref=f19e710] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Schrödinger_equation
                - text: ","
                - link "KdV equations" [ref=f19e711] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Korteweg–De_Vries_equation
                - text: ", and KdV-type equations."
                - superscript [ref=f19e712]:
                  - link "[C+03]" [ref=f19e713] [cursor=pointer]:
                    - /url: "#CITEREFC+03"
              - figure [ref=f19e714]:
                - link [ref=f19e715] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Paul_Erdos_with_Terence_Tao.jpg
                - generic [ref=f19e717]:
                  - text: Tao at the age of 10 with mathematician
                  - link "Paul Erdős" [ref=f19e718] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Paul_Erdős
                  - text: in 1985
              - paragraph [ref=f19e719]:
                - link "Michael Christ" [ref=f19e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/F._Michael_Christ
                - text: ", Colliander, and Tao developed methods of"
                - link "Carlos Kenig" [ref=f19e721] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carlos_Kenig
                - text: ","
                - link "Gustavo Ponce" [ref=f19e722] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gustavo_Ponce
                - text: ", and"
                - link "Luis Vega" [ref=f19e723] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Luis_Vega_(mathematician)
                - text: to establish ill-posedness of certain Schrödinger and KdV equations for Sobolev data of sufficiently low exponents.
                - superscript [ref=f19e724]:
                  - link "[CCT03]" [ref=f19e725] [cursor=pointer]:
                    - /url: "#CITEREFCCT03"
                - superscript [ref=f19e726]:
                  - link "[51]" [ref=f19e727] [cursor=pointer]:
                    - /url: "#cite_note-53"
                - text: In many cases these results were sharp enough to perfectly complement well-posedness results for sufficiently large exponents as due to Bourgain, Colliander−Keel−Staffilani−Takaoka−Tao, and others. Further such notable results for Schrödinger equations were found by Tao in collaboration with Ioan Bejenaru.
                - superscript [ref=f19e728]:
                  - link "[BT06]" [ref=f19e729] [cursor=pointer]:
                    - /url: "#CITEREFBT06"
              - paragraph [ref=f19e730]:
                - text: A particularly notable result of the Colliander−Keel−Staffilani−Takaoka−Tao collaboration established the long-time existence and scattering theory of a power-law Schrödinger equation in three dimensions.
                - superscript [ref=f19e731]:
                  - link "[C+08]" [ref=f19e732] [cursor=pointer]:
                    - /url: "#CITEREFC+08"
                - text: Their methods, which made use of the scale-invariance of the simple power law, were extended by Tao in collaboration with
                - link "Monica Vișan" [ref=f19e733] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monica_Vișan
                - text: and Xiaoyi Zhang to deal with nonlinearities in which the scale-invariance is broken.
                - superscript [ref=f19e734]:
                  - link "[TVZ07]" [ref=f19e735] [cursor=pointer]:
                    - /url: "#CITEREFTVZ07"
                - link "Rowan Killip" [ref=f19e736] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rowan_Killip
                - text: ", Tao, and Vișan later made notable progress on the two-dimensional problem in radial symmetry."
                - superscript [ref=f19e737]:
                  - link "[KTV09]" [ref=f19e738] [cursor=pointer]:
                    - /url: "#CITEREFKTV09"
              - paragraph [ref=f19e739]:
                - text: An article by Tao in 2001 considered the
                - link "wave maps equation" [ref=f19e740] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wave_maps_equation
                - text: with two-dimensional domain and spherical range.
                - superscript [ref=f19e741]:
                  - link "[T01a]" [ref=f19e742] [cursor=pointer]:
                    - /url: "#CITEREFT01a"
                - text: He built upon earlier innovations of
                - link "Daniel Tataru" [ref=f19e743] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Daniel_Tataru
                - text: ", who considered wave maps valued in"
                - link "Minkowski space" [ref=f19e744] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Minkowski_space
                - text: .
                - superscript [ref=f19e745]:
                  - link "[52]" [ref=f19e746] [cursor=pointer]:
                    - /url: "#cite_note-54"
                - text: Tao proved the global well-posedness of solutions with sufficiently small initial data. The fundamental difficulty is that Tao considers smallness relative to the critical Sobolev norm, which typically requires sophisticated techniques. Tao later adapted some of his work on wave maps to the setting of the
                - link "Benjamin–Ono equation" [ref=f19e747] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Benjamin–Ono_equation
                - text: ; Alexandru Ionescu and Kenig later obtained improved results with Tao's methods.
                - superscript [ref=f19e748]:
                  - link "[T04a]" [ref=f19e749] [cursor=pointer]:
                    - /url: "#CITEREFT04a"
                - superscript [ref=f19e750]:
                  - link "[53]" [ref=f19e751] [cursor=pointer]:
                    - /url: "#cite_note-55"
              - paragraph [ref=f19e752]:
                - text: In 2016, Tao constructed a variant of the
                - link "Navier–Stokes equations" [ref=f19e753] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Navier–Stokes_equations
                - text: which possess solutions exhibiting irregular behavior in finite time.
                - superscript [ref=f19e754]:
                  - link "[T16]" [ref=f19e755] [cursor=pointer]:
                    - /url: "#CITEREFT16"
                - text: Due to structural similarities between Tao's system and the Navier–Stokes equations themselves, it follows that any positive resolution of the
                - link "Navier–Stokes existence and smoothness problem" [ref=f19e756] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Navier–Stokes_existence_and_smoothness
                - text: must take into account the specific nonlinear structure of the equations. In particular, certain previously proposed resolutions of the problem could not be legitimate.
                - superscript [ref=f19e757]:
                  - link "[54]" [ref=f19e758] [cursor=pointer]:
                    - /url: "#cite_note-56"
                - text: Tao speculated that the Navier–Stokes equations might be able to simulate a
                - link "Turing complete" [ref=f19e759] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Turing_complete
                - text: system, and that as a consequence it might be possible to (negatively) resolve the existence and smoothness problem using a modification of his results.
                - superscript [ref=f19e760]:
                  - link "[5]" [ref=f19e761] [cursor=pointer]:
                    - /url: "#cite_note-singmind-5"
                - superscript [ref=f19e762]:
                  - link "[27]" [ref=f19e763] [cursor=pointer]:
                    - /url: "#cite_note-quantanavier-29"
                - text: However, such results remain (as of 2025) conjectural.
            - region [ref=f19e764]:
              - generic [ref=f19e765]:
                - heading "Harmonic analysis" [level=3] [ref=f19e766]
                - link "edit" [ref=f19e768] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=8
              - paragraph [ref=f19e769]:
                - link "Bent Fuglede" [ref=f19e770] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bent_Fuglede
                - text: introduced the
                - link "Fuglede conjecture" [ref=f19e771] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fuglede's_conjecture
                - text: in the 1970s, positing a
                - link "tile" [ref=f19e772] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tessellation
                - text: "-based characterisation of those Euclidean domains for which a Fourier ensemble provides a basis of"
                - generic [ref=f19e773]:
                  - text: L
                  - superscript [ref=f19e774]: "2"
                  - text: .
                - superscript [ref=f19e775]:
                  - link "[55]" [ref=f19e776] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - text: Tao resolved the conjecture in the negative for dimensions larger than 5, based upon the construction of an elementary counterexample to an analogous problem in the setting of
                - link "finite groups" [ref=f19e777] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Finite_group
                - text: .
                - superscript [ref=f19e778]:
                  - link "[T04b]" [ref=f19e779] [cursor=pointer]:
                    - /url: "#CITEREFT04b"
              - paragraph [ref=f19e780]:
                - text: With Camil Muscalu and
                - link "Christoph Thiele" [ref=f19e781] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christoph_Thiele
                - text: ", Tao considered certain multilinear"
                - link "singular integral" [ref=f19e782] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Singular_integral
                - text: operators with the multiplier allowed to degenerate on a
                - link "hyperplane" [ref=f19e783] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hyperplane
                - text: ", identifying conditions which ensure operator continuity relative to"
                - generic [ref=f19e784]:
                  - text: L
                  - superscript [ref=f19e785]: p
                - text: spaces.
                - superscript [ref=f19e786]:
                  - link "[MTT02]" [ref=f19e787] [cursor=pointer]:
                    - /url: "#CITEREFMTT02"
                - text: This unified and extended earlier notable results of
                - link "Ronald Coifman" [ref=f19e788] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ronald_Coifman
                - text: ","
                - link "Carlos Kenig" [ref=f19e789] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Carlos_Kenig
                - text: ","
                - link "Michael Lacey" [ref=f19e790] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_Lacey_(mathematician)
                - text: ","
                - link "Yves Meyer" [ref=f19e791] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Yves_Meyer
                - text: ","
                - link "Elias Stein" [ref=f19e792] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Elias_Stein
                - text: ", and Thiele, among others."
                - superscript [ref=f19e793]:
                  - link "[56]" [ref=f19e794] [cursor=pointer]:
                    - /url: "#cite_note-58"
                - superscript [ref=f19e795]:
                  - link "[57]" [ref=f19e796] [cursor=pointer]:
                    - /url: "#cite_note-59"
                - superscript [ref=f19e797]:
                  - link "[58]" [ref=f19e798] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - superscript [ref=f19e799]:
                  - link "[59]" [ref=f19e800] [cursor=pointer]:
                    - /url: "#cite_note-61"
                - superscript [ref=f19e801]:
                  - link "[60]" [ref=f19e802] [cursor=pointer]:
                    - /url: "#cite_note-62"
                - superscript [ref=f19e803]:
                  - link "[61]" [ref=f19e804] [cursor=pointer]:
                    - /url: "#cite_note-63"
                - text: Similar problems were analysed by Tao in 2001 in the context of Bourgain spaces, rather than the usual
                - generic [ref=f19e805]:
                  - text: L
                  - superscript [ref=f19e806]: p
                - text: spaces.
                - superscript [ref=f19e807]:
                  - link "[T01b]" [ref=f19e808] [cursor=pointer]:
                    - /url: "#CITEREFT01b"
                - text: Such estimates are used in establishing well-posedness results for dispersive partial differential equations, following famous earlier work of
                - link "Jean Bourgain" [ref=f19e809] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jean_Bourgain
                - text: ", Kenig,"
                - link "Gustavo Ponce" [ref=f19e810] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gustavo_Ponce
                - text: ", and"
                - link "Luis Vega" [ref=f19e811] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Luis_Vega_(mathematician)
                - text: ", among others."
                - superscript [ref=f19e812]:
                  - link "[62]" [ref=f19e813] [cursor=pointer]:
                    - /url: "#cite_note-64"
                - superscript [ref=f19e814]:
                  - link "[63]" [ref=f19e815] [cursor=pointer]:
                    - /url: "#cite_note-65"
              - paragraph [ref=f19e816]:
                - text: A number of Tao's results deal with "restriction" phenomena in Fourier analysis, which have been widely studied since the time of the articles of
                - link "Charles Fefferman" [ref=f19e817] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_Fefferman
                - text: ","
                - link "Robert Strichartz" [ref=f19e818] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Robert_Strichartz
                - text: ", and Peter Tomas in the 1970s."
                - superscript [ref=f19e819]:
                  - link "[64]" [ref=f19e820] [cursor=pointer]:
                    - /url: "#cite_note-66"
                - superscript [ref=f19e821]:
                  - link "[65]" [ref=f19e822] [cursor=pointer]:
                    - /url: "#cite_note-67"
                - superscript [ref=f19e823]:
                  - link "[66]" [ref=f19e824] [cursor=pointer]:
                    - /url: "#cite_note-68"
                - text: Here one studies the operation which restricts input functions on
                - link "Euclidean space" [ref=f19e825] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Euclidean_space
                - text: to a
                - link "submanifold" [ref=f19e826] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Submanifold
                - text: and outputs the product of the
                - link "Fourier transforms" [ref=f19e827] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fourier_transform
                - text: of the corresponding measures. It is of major interest to identify exponents such that this operation is continuous relative to
                - generic [ref=f19e828]:
                  - text: L
                  - superscript [ref=f19e829]: p
                - text: spaces. Such multilinear problems originated in the 1990s, including in notable work of
                - link "Jean Bourgain" [ref=f19e830] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jean_Bourgain
                - text: ","
                - link "Sergiu Klainerman" [ref=f19e831] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sergiu_Klainerman
                - text: ", and"
                - link "Matei Machedon" [ref=f19e832] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Matei_Machedon
                - text: .
                - superscript [ref=f19e833]:
                  - link "[67]" [ref=f19e834] [cursor=pointer]:
                    - /url: "#cite_note-69"
                - superscript [ref=f19e835]:
                  - link "[68]" [ref=f19e836] [cursor=pointer]:
                    - /url: "#cite_note-70"
                - superscript [ref=f19e837]:
                  - link "[69]" [ref=f19e838] [cursor=pointer]:
                    - /url: "#cite_note-71"
                - text: In collaboration with Ana Vargas and
                - link "Luis Vega" [ref=f19e839] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Luis_Vega_(mathematician)
                - text: ", Tao made some foundational contributions to the study of the bilinear restriction problem, establishing new exponents and drawing connections to the linear restriction problem. They also found analogous results for the bilinear Kakeya problem which is based upon the"
                - link "X-ray transform" [ref=f19e840] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/X-ray_transform
                - text: instead of the Fourier transform.
                - superscript [ref=f19e841]:
                  - link "[TVV98]" [ref=f19e842] [cursor=pointer]:
                    - /url: "#CITEREFTVV98"
                - text: In 2003, Tao adapted ideas developed by
                - link "Thomas Wolff" [ref=f19e843] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Thomas_Wolff
                - text: for bilinear restriction to conical sets into the setting of restriction to quadratic hypersurfaces.
                - superscript [ref=f19e844]:
                  - link "[T03]" [ref=f19e845] [cursor=pointer]:
                    - /url: "#CITEREFT03"
                - superscript [ref=f19e846]:
                  - link "[70]" [ref=f19e847] [cursor=pointer]:
                    - /url: "#cite_note-72"
                - text: The multilinear setting for these problems was further developed by Tao in collaboration with
                - link "Jonathan Bennett" [ref=f19e848] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jonathan_Bennett_(mathematician)
                - text: and Anthony Carbery; their work was extensively used by Bourgain and
                - link "Larry Guth" [ref=f19e849] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Larry_Guth
                - text: in deriving estimates for general
                - link "oscillatory integral operators" [ref=f19e850] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Oscillatory_integral
                - text: .
                - superscript [ref=f19e851]:
                  - link "[BCT06]" [ref=f19e852] [cursor=pointer]:
                    - /url: "#CITEREFBCT06"
                - superscript [ref=f19e853]:
                  - link "[71]" [ref=f19e854] [cursor=pointer]:
                    - /url: "#cite_note-73"
            - region [ref=f19e855]:
              - generic [ref=f19e856]:
                - heading "Compressed sensing and statistics" [level=3] [ref=f19e857]
                - link "edit" [ref=f19e859] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=9
              - paragraph [ref=f19e860]:
                - text: In collaboration with
                - link "Emmanuel Candes" [ref=f19e861] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Emmanuel_Candes
                - text: and Justin Romberg, Tao has made notable contributions to the field of
                - link "compressed sensing" [ref=f19e862] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Compressed_sensing
                - text: . In mathematical terms, most of their results identify settings in which a convex optimisation problem correctly computes the solution of an optimisation problem which seems to lack a computationally tractable structure. These problems are of the nature of finding the solution of an underdetermined linear system with the minimal possible number of nonzero entries, referred to as "sparsity". Around the same time,
                - link "David Donoho" [ref=f19e863] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/David_Donoho
                - text: considered similar problems from the alternative perspective of high-dimensional geometry.
                - superscript [ref=f19e864]:
                  - link "[72]" [ref=f19e865] [cursor=pointer]:
                    - /url: "#cite_note-74"
              - paragraph [ref=f19e866]:
                - text: Motivated by striking numerical experiments, Candes, Romberg, and Tao first studied the case where the matrix is given by the discrete Fourier transform.
                - superscript [ref=f19e867]:
                  - link "[CRT06a]" [ref=f19e868] [cursor=pointer]:
                    - /url: "#CITEREFCRT06a"
                - text: Candes and Tao abstracted the problem and introduced the notion of a "restricted linear isometry," which is a matrix that is quantitatively close to an isometry when restricted to certain subspaces.
                - superscript [ref=f19e869]:
                  - link "[CT05]" [ref=f19e870] [cursor=pointer]:
                    - /url: "#CITEREFCT05"
                - text: They showed that it is sufficient for either exact or optimally approximate recovery of sufficiently sparse solutions. Their proofs, which involved the theory of convex duality, were markedly simplified in collaboration with Romberg, to use only linear algebra and elementary ideas of harmonic analysis.
                - superscript [ref=f19e871]:
                  - link "[CRT06b]" [ref=f19e872] [cursor=pointer]:
                    - /url: "#CITEREFCRT06b"
                - text: These ideas and results were later improved by Candes.
                - superscript [ref=f19e873]:
                  - link "[73]" [ref=f19e874] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - text: Candes and Tao also considered relaxations of the sparsity condition, such as power-law decay of coefficients.
                - superscript [ref=f19e875]:
                  - link "[CT06]" [ref=f19e876] [cursor=pointer]:
                    - /url: "#CITEREFCT06"
                - text: They complemented these results by drawing on a large corpus of past results in random matrix theory to show that, according to the Gaussian ensemble, a large number of matrices satisfy the restricted isometry property.
                - superscript [ref=f19e877]:
                  - link "[CT06]" [ref=f19e878] [cursor=pointer]:
                    - /url: "#CITEREFCT06"
              - paragraph [ref=f19e879]:
                - text: In 2007, Candes and Tao introduced a novel statistical estimator for linear regression, which they called the "Dantzig selector." They proved a number of results on its success as an estimator and model selector, roughly in parallel to their earlier work on compressed sensing.
                - superscript [ref=f19e880]:
                  - link "[CT07]" [ref=f19e881] [cursor=pointer]:
                    - /url: "#CITEREFCT07"
                - text: A number of other authors have since studied the Dantzig selector, comparing it to similar objects such as the
                - link "statistical lasso" [ref=f19e882] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lasso_(statistics)
                - text: introduced in the 1990s.
                - superscript [ref=f19e883]:
                  - link "[74]" [ref=f19e884] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - link "Trevor Hastie" [ref=f19e885] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trevor_Hastie
                - text: ","
                - link "Robert Tibshirani" [ref=f19e886] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Robert_Tibshirani
                - text: ", and"
                - link "Jerome H. Friedman" [ref=f19e887] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jerome_H._Friedman
                - text: conclude that it is "somewhat unsatisfactory" in a number of cases.
                - superscript [ref=f19e888]:
                  - link "[75]" [ref=f19e889] [cursor=pointer]:
                    - /url: "#cite_note-77"
                - text: Nonetheless, it remains of significant interest in the statistical literature.
              - paragraph [ref=f19e890]:
                - text: In 2009, Candes and Benjamin Recht considered an analogous problem for recovering a matrix from knowledge of only a few of its entries and the information that the matrix is of low rank.
                - superscript [ref=f19e891]:
                  - link "[76]" [ref=f19e892] [cursor=pointer]:
                    - /url: "#cite_note-78"
                - text: They formulated the problem in terms of convex optimisation, studying minimisation of the nuclear norm. Candes and Tao, in 2010, developed further results and techniques for the same problem.
                - superscript [ref=f19e893]:
                  - link "[CT10]" [ref=f19e894] [cursor=pointer]:
                    - /url: "#CITEREFCT10"
                - text: Improved results were later found by Recht.
                - superscript [ref=f19e895]:
                  - link "[77]" [ref=f19e896] [cursor=pointer]:
                    - /url: "#cite_note-79"
                - text: Similar problems and results have also been considered by a number of other authors.
                - superscript [ref=f19e897]:
                  - link "[78]" [ref=f19e898] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - superscript [ref=f19e899]:
                  - link "[79]" [ref=f19e900] [cursor=pointer]:
                    - /url: "#cite_note-81"
                - superscript [ref=f19e901]:
                  - link "[80]" [ref=f19e902] [cursor=pointer]:
                    - /url: "#cite_note-82"
                - superscript [ref=f19e903]:
                  - link "[81]" [ref=f19e904] [cursor=pointer]:
                    - /url: "#cite_note-83"
                - superscript [ref=f19e905]:
                  - link "[82]" [ref=f19e906] [cursor=pointer]:
                    - /url: "#cite_note-84"
            - region [ref=f19e907]:
              - generic [ref=f19e908]:
                - heading "Random matrices" [level=3] [ref=f19e909]
                - link "edit" [ref=f19e911] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=10
              - paragraph [ref=f19e912]:
                - text: In the 1950s,
                - link "Eugene Wigner" [ref=f19e913] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eugene_Wigner
                - text: initiated the study of
                - link "random matrices" [ref=f19e914] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Random_matrices
                - text: and their eigenvalues.
                - superscript [ref=f19e915]:
                  - link "[83]" [ref=f19e916] [cursor=pointer]:
                    - /url: "#cite_note-85"
                - superscript [ref=f19e917]:
                  - link "[84]" [ref=f19e918] [cursor=pointer]:
                    - /url: "#cite_note-86"
                - text: Wigner studied the case of
                - link "hermitian" [ref=f19e919] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hermitian_matrix
                - text: and
                - link "symmetric matrices" [ref=f19e920] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Symmetric_matrices
                - text: ", proving a \"semicircle law\" for their eigenvalues. In 2010, Tao and"
                - link "Van Vu" [ref=f19e921] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Van_H._Vu
                - text: made a major contribution to the study of non-symmetric random matrices. They showed that if n is large and the entries of a
                - generic [ref=f19e922]: n × n
                - text: matrix A are selected randomly according to any fixed
                - link "probability distribution" [ref=f19e923] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Probability_distribution
                - text: of
                - link "expectation" [ref=f19e924] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Expected_value
                - text: 0 and
                - link "standard deviation" [ref=f19e925] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Standard_deviation
                - text: 1, then the eigenvalues of A will tend to be uniformly scattered across the disk of radius
                - generic [ref=f19e926]:
                  - text: "n"
                  - superscript [ref=f19e927]: 1/2
                - text: around the origin; this can be made precise using the language of
                - link "measure theory" [ref=f19e928] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Measure_theory
                - text: .
                - superscript [ref=f19e929]:
                  - link "[TV10]" [ref=f19e930] [cursor=pointer]:
                    - /url: "#CITEREFTV10"
                - text: This gave a proof of the long-conjectured
                - link "circular law" [ref=f19e931] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Circular_law
                - text: ", which had previously been proved in weaker formulations by many other authors. In Tao and Vu's formulation, the circular law becomes an immediate consequence of a \"universality principle\" stating that the distribution of the eigenvalues can depend only on the average and standard deviation of the given component-by-component probability distribution, thereby providing a reduction of the general circular law to a calculation for specially-chosen probability distributions."
              - paragraph [ref=f19e932]:
                - text: In 2011, Tao and
                - link "Vu" [ref=f19e933] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Van_H._Vu
                - text: established a "four
                - link "moment" [ref=f19e934] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Moment_(mathematics)
                - text: theorem", which applies to random
                - link "hermitian matrices" [ref=f19e935] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hermitian_matrices
                - text: whose components are independently distributed, each with average 0 and standard deviation 1, and which are exponentially unlikely to be large (as for a
                - link "Gaussian distribution" [ref=f19e936] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gaussian_distribution
                - text: ). If one considers two such random matrices which agree on the average value of any quadratic polynomial in the diagonal entries and on the average value of any quartic polynomial in the off-diagonal entries, then Tao and Vu show that the expected value of a large number of functions of the eigenvalues will also coincide, up to an error which is uniformly controllable by the size of the matrix and which becomes arbitrarily small as the size of the matrix increases.
                - superscript [ref=f19e937]:
                  - link "[TV11]" [ref=f19e938] [cursor=pointer]:
                    - /url: "#CITEREFTV11"
                - text: Similar results were obtained around the same time by László, Erdős,
                - link "Horng-Tzer Yau" [ref=f19e939] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Horng-Tzer_Yau
                - text: ", and Jun Yin."
                - superscript [ref=f19e940]:
                  - link "[85]" [ref=f19e941] [cursor=pointer]:
                    - /url: "#cite_note-87"
                - superscript [ref=f19e942]:
                  - link "[86]" [ref=f19e943] [cursor=pointer]:
                    - /url: "#cite_note-88"
            - region [ref=f19e944]:
              - generic [ref=f19e945]:
                - heading "Analytic number theory and arithmetic combinatorics" [level=3] [ref=f19e946]
                - link "edit" [ref=f19e948] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=11
              - figure "Tao (second from left) with UCLA undergraduate students in 2021" [ref=f19e949]:
                - link [ref=f19e950] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Professor_Tao_with_his_Devoted_Students.jpg
              - paragraph [ref=f19e953]:
                - text: In 2004, Tao, together with
                - link "Jean Bourgain" [ref=f19e954] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jean_Bourgain
                - text: and
                - link "Nets Katz" [ref=f19e955] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nets_Katz
                - text: ", studied the additive and multiplicative structure of subsets of"
                - link "finite fields" [ref=f19e956] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Finite_fields
                - text: of prime order.
                - superscript [ref=f19e957]:
                  - link "[BKT04]" [ref=f19e958] [cursor=pointer]:
                    - /url: "#CITEREFBKT04"
                - text: It is well known that there are no nontrivial
                - link "subrings" [ref=f19e959] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Subring
                - text: of such a field. Bourgain, Katz, and Tao provided a quantitative formulation of this fact, showing that for any subset of such a field, the number of sums and products of elements of the subset must be quantitatively large, as compared to the size of the field and the size of the subset itself. Improvements of their result were later given by Bourgain, Alexey Glibichuk, and
                - link "Sergei Konyagin" [ref=f19e960] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sergei_Konyagin
                - text: .
                - superscript [ref=f19e961]:
                  - link "[87]" [ref=f19e962] [cursor=pointer]:
                    - /url: "#cite_note-89"
                - superscript [ref=f19e963]:
                  - link "[88]" [ref=f19e964] [cursor=pointer]:
                    - /url: "#cite_note-90"
              - figure "Tao teaching analytic number theory at UCLA in January 2025" [ref=f19e965]:
                - link [ref=f19e966] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Prof._Terry_Tao_teaching_analytic_prime_number_theory_in_January_2025.jpg
              - paragraph [ref=f19e969]:
                - text: Tao and
                - link "Ben Green" [ref=f19e970] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ben_Green_(mathematician)
                - text: proved the existence of arbitrarily long
                - link "arithmetic progressions" [ref=f19e971] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arithmetic_progression
                - text: in the
                - link "prime numbers" [ref=f19e972] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Prime_number
                - text: ; this result is generally referred to as the
                - link "Green–Tao theorem" [ref=f19e973] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Green–Tao_theorem
                - text: ", and is among Tao's most well-known results."
                - superscript [ref=f19e974]:
                  - link "[GT08]" [ref=f19e975] [cursor=pointer]:
                    - /url: "#CITEREFGT08"
                - text: The source of Green and Tao's arithmetic progressions is
                - link "Endre Szemerédi" [ref=f19e976] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Endre_Szemerédi
                - text: "'s"
                - link "1975 theorem" [ref=f19e977] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Szemerédi's_theorem
                - text: on existence of arithmetic progressions in certain sets of integers. Green and Tao showed that one can use a "transference principle" to extend the validity of Szemerédi's theorem to further sets of integers. The Green–Tao theorem then arises as a special case, although it is not trivial to show that the prime numbers satisfy the conditions of Green and Tao's extension of the Szemerédi theorem.
              - paragraph [ref=f19e978]:
                - text: In 2010, Green and Tao gave a multilinear extension of Dirichlet's celebrated
                - link "theorem on arithmetic progressions" [ref=f19e979] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dirichlet's_theorem_on_arithmetic_progressions
                - text: . Given a
                - generic [ref=f19e980]: k × n
                - text: matrix A and a
                - generic [ref=f19e981]: k × 1
                - text: matrix v whose components are all integers, Green and Tao give conditions on when there exist infinitely many
                - generic [ref=f19e982]: n × 1
                - text: matrices x such that all components of
                - generic [ref=f19e983]: Ax + v
                - text: are prime numbers.
                - superscript [ref=f19e984]:
                  - link "[GT10]" [ref=f19e985] [cursor=pointer]:
                    - /url: "#CITEREFGT10"
                - text: The proof of Green and Tao was incomplete, as it was conditioned upon unproven conjectures. Those conjectures were proved in later work of Green, Tao, and
                - link "Tamar Ziegler" [ref=f19e986] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tamar_Ziegler
                - text: .
                - superscript [ref=f19e987]:
                  - link "[GTZ12]" [ref=f19e988] [cursor=pointer]:
                    - /url: "#CITEREFGTZ12"
          - region [ref=f19e989]:
            - generic [ref=f19e990]:
              - heading "Views on artificial intelligence in mathematics" [level=2] [ref=f19e991]
              - link "edit" [ref=f19e993] [cursor=pointer]:
                - /url: /w/index.php?title=Terence_Tao&action=edit&section=12
            - paragraph [ref=f19e994]:
              - text: Tao has become one of the most prominent mathematicians writing and speaking about the use of
              - link "artificial intelligence" [ref=f19e995] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_intelligence
              - text: (AI) and
              - link "proof assistants" [ref=f19e996] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Proof_assistant
              - text: in mathematical research;
              - link "Quanta Magazine" [ref=f19e998] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Quanta_Magazine
              - text: has described him as an evangelist for machine-assisted mathematics.
              - superscript [ref=f19e999]:
                - link "[89]" [ref=f19e1000] [cursor=pointer]:
                  - /url: "#cite_note-quanta-evangelist-91"
              - text: He surveyed the area in the expository article "Machine-Assisted Proof" in the
              - link "Notices of the American Mathematical Society" [ref=f19e1002] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Notices_of_the_American_Mathematical_Society
              - text: ","
              - superscript [ref=f19e1003]:
                - link "[90]" [ref=f19e1004] [cursor=pointer]:
                  - /url: "#cite_note-notices-map-92"
              - text: has served since 2024 on the advisory committee of the
              - link "XTX Markets" [ref=f19e1005] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/XTX_Markets
              - text: Artificial Intelligence Mathematical Olympiad Prize,
              - superscript [ref=f19e1006]:
                - link "[91]" [ref=f19e1007] [cursor=pointer]:
                  - /url: "#cite_note-aimo-93"
              - text: and co-chaired a working group on generative AI during his term on the
              - link "President's Council of Advisors on Science and Technology" [ref=f19e1008] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/President's_Council_of_Advisors_on_Science_and_Technology
              - text: .
              - superscript [ref=f19e1009]:
                - link "[89]" [ref=f19e1010] [cursor=pointer]:
                  - /url: "#cite_note-quanta-evangelist-91"
            - region [ref=f19e1011]:
              - generic [ref=f19e1012]:
                - heading "Formalisation and large-scale collaboration" [level=3] [ref=f19e1013]
                - link "edit" [ref=f19e1015] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=13
              - paragraph [ref=f19e1016]:
                - text: Having earlier led several
                - link "Polymath Project" [ref=f19e1017] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Polymath_Project
                - text: collaborations, Tao concluded that open collaboration at scale was constrained by the need for a human organiser to check every contribution, and that automated verification could remove that bottleneck.
                - superscript [ref=f19e1018]:
                  - link "[89]" [ref=f19e1019] [cursor=pointer]:
                    - /url: "#cite_note-quanta-evangelist-91"
                - text: He began learning the
                - link "Lean" [ref=f19e1020] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lean_(proof_assistant)
                - text: proof assistant in late 2023, and in November of that year launched a crowdsourced formalisation of the polynomial Freiman–Ruzsa conjecture he had proved with
                - link "Timothy Gowers" [ref=f19e1021] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Timothy_Gowers
                - text: ","
                - link "Ben Green" [ref=f19e1022] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ben_Green_(mathematician)
                - text: and Freddie Manners; volunteers completed it in roughly three weeks, with Tao writing little of the Lean code himself.
                - superscript [ref=f19e1023]:
                  - link "[89]" [ref=f19e1024] [cursor=pointer]:
                    - /url: "#cite_note-quanta-evangelist-91"
              - paragraph [ref=f19e1025]:
                - text: In September 2024, he launched the Equational Theories Project, a pilot in machine-assisted collaboration that set out to determine every implication among the 4,694 simplest equational laws on
                - link "magmas" [ref=f19e1026] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Magma_(algebra)
                - text: . Combining human-written and automatically generated proofs, all validated in Lean, the project resolved all 22,028,942 implications by April 2025 and turned up new magma constructions in the process.
                - superscript [ref=f19e1027]:
                  - link "[92]" [ref=f19e1028] [cursor=pointer]:
                    - /url: "#cite_note-etp-paper-94"
                - text: Tao regarded it less as a result in itself than as a demonstration of an "experimental" mode of mathematics analogous to experimental physics, in which large volumes of machine-checked work complement rather than replace conventional theory.
                - superscript [ref=f19e1029]:
                  - link "[89]" [ref=f19e1030] [cursor=pointer]:
                    - /url: "#cite_note-quanta-evangelist-91"
            - region [ref=f19e1031]:
              - generic [ref=f19e1032]:
                - heading "Assessments of AI capability" [level=3] [ref=f19e1033]
                - link "edit" [ref=f19e1035] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=14
              - paragraph [ref=f19e1036]:
                - text: Tao's published assessments have shifted substantially over time. In September 2024, after testing OpenAI's o1 model on research problems, he likened it to a mediocre, but not completely incompetent graduate student that reached correct answers only under heavy prompting.
                - superscript [ref=f19e1037]:
                  - link "[93]" [ref=f19e1038] [cursor=pointer]:
                    - /url: "#cite_note-techcrunch-95"
                - text: Interviewed by
                - link "The Atlantic" [ref=f19e1040] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Atlantic
                - text: "the following month, he drew a sharper distinction: graduate students learn from correction, whereas a model told that its approach fails may adjust briefly and then revert. He nonetheless described a prospective industrial-scale mathematics in which AI acts less as an independent creative collaborator than as an accelerant for human hypotheses, and compared the situation to chess, where engines surpassed players without diminishing the game."
                - superscript [ref=f19e1041]:
                  - link "[94]" [ref=f19e1042] [cursor=pointer]:
                    - /url: "#cite_note-atlantic-96"
              - paragraph [ref=f19e1043]:
                - text: By 2026 he was reporting substantive assistance in his own research. His paper on local Bernstein theory and lower bounds for
                - link "Lebesgue constants" [ref=f19e1044] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lebesgue_constant
                - text: credits a language model with supplying a duality argument, based on the Nevanlinna two-constant theorem, for an inequality he had not been able to prove himself, and records that an AI system had earlier confirmed the inequality numerically.
                - superscript [ref=f19e1045]:
                  - link "[95]" [ref=f19e1046] [cursor=pointer]:
                    - /url: "#cite_note-bernstein-97"
                - text: "He has coupled this with a standing caution: because most mathematics is written informally rather than machine-checked, AI can produce arguments that read as polished while concealing an unsound step, and formal verification is the natural corrective."
                - superscript [ref=f19e1047]:
                  - link "[90]" [ref=f19e1048] [cursor=pointer]:
                    - /url: "#cite_note-notices-map-92"
            - region [ref=f19e1049]:
              - generic [ref=f19e1050]:
                - heading "Mathematics in the age of AI" [level=3] [ref=f19e1051]
                - link "edit" [ref=f19e1053] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=15
              - paragraph [ref=f19e1054]:
                - text: Tao delivered a public lecture titled "Mathematics in the Age of AI" at the
                - link "2026 International Congress of Mathematicians" [ref=f19e1055] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Congress_of_Mathematicians
                - text: in Philadelphia in July 2026, subsequently written up as an essay for the congress proceedings. Rather than debating how capable such tools will become, the essay conditions on the assumption that research-level capability will arrive and asks instead what the goals and values of mathematical research actually are, using problem solving as a case study.
                - superscript [ref=f19e1056]:
                  - link "[96]" [ref=f19e1057] [cursor=pointer]:
                    - /url: "#cite_note-icm-essay-98"
              - paragraph [ref=f19e1058]:
                - text: "Tao distinguished several stages of problem solving and argued that AI has affected them unevenly. Producing and verifying a proof is the stage machines already handle well; the difficulty arises at the stages that follow, in which a result must be explained clearly enough to be communicated, accepted and used by other mathematicians, and eventually canonicalised into textbooks—the point, he argued, at which a field becomes usable by engineers and physicists, and the very corpus on which AI systems were trained. He warned that machine-generated proofs running to a hundred thousand lines can be verified without anyone understanding them, including whoever wrote the prompt, and suggested that mathematicians will need to place more weight on describing process rather than letting outcomes speak for themselves, since outcomes are now automatable and current tools are opaque about how they reach them. He closed by urging the discipline to take the initiative in deciding where AI should be used: We set the rules on what's acceptable or not, and not leave that to external actors."
                - superscript [ref=f19e1059]:
                  - link "[97]" [ref=f19e1060] [cursor=pointer]:
                    - /url: "#cite_note-simons-icm-99"
            - region [ref=f19e1061]:
              - generic [ref=f19e1062]:
                - heading "Joint declaration on AI in mathematics" [level=3] [ref=f19e1063]
                - link "edit" [ref=f19e1065] [cursor=pointer]:
                  - /url: /w/index.php?title=Terence_Tao&action=edit&section=16
              - paragraph [ref=f19e1066]:
                - text: On 11 September 2026, Tao published on his blog What's new a joint declaration titled "A Severe Misalignment of AI in Mathematics", signed by 25
                - link "Fields Medallists" [ref=f19e1067] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fields_Medal
                - text: spanning award years from 1978 to 2026, including
                - link "Pierre Deligne" [ref=f19e1068] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pierre_Deligne
                - text: ","
                - link "Maxim Kontsevich" [ref=f19e1069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maxim_Kontsevich
                - text: ","
                - link "Peter Scholze" [ref=f19e1070] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Peter_Scholze
                - text: ","
                - link "Maryna Viazovska" [ref=f19e1071] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maryna_Viazovska
                - text: ","
                - link "James Maynard" [ref=f19e1072] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/James_Maynard_(mathematician)
                - text: and
                - link "Yu Deng" [ref=f19e1073] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Yu_Deng
                - text: .
                - superscript [ref=f19e1074]:
                  - link "[98]" [ref=f19e1075] [cursor=pointer]:
                    - /url: "#cite_note-tao-declaration-100"
                - text: Tao wrote that the text grew out of roughly a week of discussion among the signatories, and that the group had forgone the broader consultative process used for the earlier Leiden declaration because it judged the situation urgent.
                - superscript [ref=f19e1076]:
                  - link "[98]" [ref=f19e1077] [cursor=pointer]:
                    - /url: "#cite_note-tao-declaration-100"
                - text: The full text is hosted at mathandai.org, which invites further endorsements from academics.
                - superscript [ref=f19e1078]:
                  - link "[99]" [ref=f19e1079] [cursor=pointer]:
                    - /url: "#cite_note-mathandai-101"
              - paragraph [ref=f19e1080]:
                - text: The declaration accepts that the mathematical capabilities of
                - link "large language models" [ref=f19e1081] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Large_language_model
                - text: have improved sharply in recent months, to the point of settling significant open problems, but argues that the use of such problems as capability benchmarks by AI companies is detrimental to the discipline. It holds that problem solving is a proxy for mathematics' primary aim of conceptual understanding and insight, and that mass production of true-or-false statements at increasing speed risks displacing the slower human processes—talks, discussion, simplification and eventual textbook exposition—through which results enter the mathematical canon. It also raises attribution and plagiarism concerns about results announced before a proper writeup isolating new methods and citing prior work, and presents the situation as one instance of a broader misalignment confronting other scientific and creative professions.
                - superscript [ref=f19e1082]:
                  - link "[99]" [ref=f19e1083] [cursor=pointer]:
                    - /url: "#cite_note-mathandai-101"
              - paragraph [ref=f19e1084]:
                - text: The declaration followed reports days earlier that
                - link "OpenAI" [ref=f19e1085] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/OpenAI
                - text: had claimed a proof related to one of the
                - link "Millennium Prize Problems" [ref=f19e1086] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Millennium_Prize_Problems
                - text: ", and was reported by"
                - link "The Economist" [ref=f19e1088] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Economist
                - text: .
                - superscript [ref=f19e1089]:
                  - link "[100]" [ref=f19e1090] [cursor=pointer]:
                    - /url: "#cite_note-economist-102"
          - region [ref=f19e1091]:
            - generic [ref=f19e1092]:
              - heading "Views on U.S. research policy" [level=2] [ref=f19e1093]
              - link "edit" [ref=f19e1095] [cursor=pointer]:
                - /url: /w/index.php?title=Terence_Tao&action=edit&section=17
            - paragraph [ref=f19e1096]:
              - text: On August 18, 2025, Terence Tao wrote an article to express his disapproval of United States president
              - link "Donald Trump" [ref=f19e1097] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Donald_Trump
              - text: "'s policies cutting research funding, which greatly affected his mathematics research."
              - superscript [ref=f19e1098]:
                - link "[101]" [ref=f19e1099] [cursor=pointer]:
                  - /url: "#cite_note-103"
              - superscript [ref=f19e1100]:
                - link "[102]" [ref=f19e1101] [cursor=pointer]:
                  - /url: "#cite_note-u608-104"
              - text: As a result of such funding cuts, two of Terence Tao's research grants were suspended by the
              - link "National Science Foundation" [ref=f19e1102] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/National_Science_Foundation
              - text: as part of a broader federal action that affected his university,
              - link "UCLA" [ref=f19e1103] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/UCLA
              - text: . One of the grants directly supported his research at UCLA, while another supported UCLA's
              - link "Institute for Pure and Applied Mathematics" [ref=f19e1104] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Institute_for_Pure_and_Applied_Mathematics
              - text: (IPAM) where Tao oversees research projects.
              - superscript [ref=f19e1105]:
                - link "[103]" [ref=f19e1106] [cursor=pointer]:
                  - /url: "#cite_note-b740-105"
            - paragraph [ref=f19e1107]:
              - text: Tao has argued that these cuts have serious consequences for the recruitment of academic talent and hinder research advancement.
              - superscript [ref=f19e1108]:
                - link "[104]" [ref=f19e1109] [cursor=pointer]:
                  - /url: "#cite_note-e657-106"
              - text: Although his research is in pure mathematics, it potentially could lay foundations in
              - link "applied mathematics" [ref=f19e1110] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Applied_mathematics
              - text: supporting developments in areas such as
              - link "cryptography" [ref=f19e1111] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cryptography
              - text: and
              - link "cybersecurity" [ref=f19e1112] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cybersecurity
              - text: .
              - superscript [ref=f19e1113]:
                - link "[105]" [ref=f19e1114] [cursor=pointer]:
                  - /url: "#cite_note-z238-107"
              - text: Also, previous collaborative research of Tao's in
              - link "signal processing" [ref=f19e1115] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Signal_processing
              - text: has greatly accelerated
              - link "MRI scan" [ref=f19e1116] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MRI_scan
              - text: speed.
