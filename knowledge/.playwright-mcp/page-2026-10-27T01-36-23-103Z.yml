                  - row [ref=f45e6273]:
                    - cell "1859?" [ref=f45e6274]
                    - cell "3" [ref=f45e6275]
                    - cell [ref=f45e6276]:
                      - text: B. Riemann used the
                      - link "Riemann–Siegel formula" [ref=f45e6277] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Riemann–Siegel_formula
                      - text: (unpublished, but reported in
                      - link "Siegel 1932" [ref=f45e6278] [cursor=pointer]:
                        - /url: "#CITEREFSiegel1932"
                      - text: ).
                  - row [ref=f45e6279]:
                    - cell "1903" [ref=f45e6280]
                    - cell "15" [ref=f45e6281]
                    - cell [ref=f45e6282]:
                      - text: J. P.
                      - link "Gram (1903)" [ref=f45e6283] [cursor=pointer]:
                        - /url: "#CITEREFGram1903"
                      - text: used the
                      - link "Euler–Maclaurin formula" [ref=f45e6284] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Euler–Maclaurin_formula
                      - text: and discovered
                      - link "Gram's law" [ref=f45e6285] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Gram's_law
                      - text: . He showed that all 10 zeros with imaginary part at most 50 range lie on the critical line with real part 1/2 by computing the sum of the inverse 10th powers of the roots he found.
                  - row [ref=f45e6286]:
                    - cell "1914" [ref=f45e6287]
                    - cell [ref=f45e6288]:
                      - text: 79 (
                      - generic [ref=f45e6289]:
                        - text: γ
                        - subscript [ref=f45e6290]: "n"
                      - text: ≤ 200)
                    - cell [ref=f45e6291]:
                      - text: R. J.
                      - link "Backlund (1914)" [ref=f45e6292] [cursor=pointer]:
                        - /url: "#CITEREFBacklund1914"
                      - text: introduced a better method of checking all the zeros up to that point are on the line, by studying the argument S(T) of the zeta function.
                  - row [ref=f45e6293]:
                    - cell "1925" [ref=f45e6294]
                    - cell [ref=f45e6295]:
