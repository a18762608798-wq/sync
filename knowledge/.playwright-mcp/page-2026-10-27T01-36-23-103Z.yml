              - paragraph [ref=f45e4072]:
                - text: The
                - link "Lee–Yang theorem" [ref=f45e4073] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lee–Yang_theorem
                - text: states that the zeros of certain
                - link "partition functions" [ref=f45e4074] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Partition_function_(statistical_mechanics)
                - text: in
                - link "statistical mechanics" [ref=f45e4075] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Statistical_mechanics
                - text: all lie on a "critical line" with their real part equal to 0, and this has led to some speculation about a relationship with the Riemann hypothesis.
                - superscript [ref=f45e4076]:
                  - link "[44]" [ref=f45e4077] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEKnauf1999-44"
            - region [ref=f45e4079]:
              - generic [ref=f45e4080]:
