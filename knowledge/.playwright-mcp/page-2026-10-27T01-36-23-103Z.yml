              - text: showed there are infinitely many zeros on the critical line, by considering moments of certain functions related to the zeta function.
              - link "Selberg (1942)" [ref=f45e5308] [cursor=pointer]:
                - /url: "#CITEREFSelberg1942"
              - text: proved that at least a (small) positive proportion of zeros lie on the line.
              - link "Levinson (1974)" [ref=f45e5309] [cursor=pointer]:
