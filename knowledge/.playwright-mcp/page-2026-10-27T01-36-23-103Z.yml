                - text: ", p. 359) say"
              - blockquote [ref=f45e3277]:
                - paragraph [ref=f45e3278]: The method of proof here is truly amazing. If the generalized Riemann hypothesis is true, then the theorem is true. If the generalized Riemann hypothesis is false, then the theorem is true. Thus, the theorem is true!!
              - paragraph [ref=f45e3279]: "Care should be taken to understand what is meant by saying the generalized Riemann hypothesis is false: one should specify exactly which class of Dirichlet series has a counterexample."
