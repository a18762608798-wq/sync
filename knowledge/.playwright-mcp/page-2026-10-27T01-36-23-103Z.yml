            - region [ref=f45e3169]:
              - generic [ref=f45e3170]:
                - heading "Consequences of the generalized Riemann hypothesis" [level=3] [ref=f45e3171]
                - link "edit" [ref=f45e3173] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=9
              - paragraph [ref=f45e3174]:
                - text: Several applications use the
                - link "generalized Riemann hypothesis" [ref=f45e3175] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Generalized_Riemann_hypothesis
                - text: for
                - link "Dirichlet L-series" [ref=f45e3176] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dirichlet_L-series
                - text: or
                - link "zeta functions of number fields" [ref=f45e3177] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dedekind_zeta_function
                - text: rather than just the Riemann hypothesis. Many basic properties of the Riemann zeta function can easily be generalized to all Dirichlet L-series, so it is plausible that a method that proves the Riemann hypothesis for the Riemann zeta function would also work for the generalized Riemann hypothesis for Dirichlet L-functions. Several results first proved using the generalized Riemann hypothesis were later given unconditional proofs without using it, though these were usually much harder. Many of the consequences on the following list are taken from
                - link "Conrad (2010)" [ref=f45e3178] [cursor=pointer]:
                  - /url: "#CITEREFConrad2010"
                - text: .
              - list [ref=f45e3179]:
                - listitem [ref=f45e3180]:
                  - text: In 1913,
                  - link "Grönwall" [ref=f45e3181] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Thomas_Hakon_Grönwall
                  - text: showed that the generalized Riemann hypothesis implies that Gauss's
                  - link "list of imaginary quadratic fields with class number 1" [ref=f45e3182] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Class_number_problem
                  - text: is complete, though Baker, Stark and Heegner later gave unconditional proofs of this without using the generalized Riemann hypothesis.
                - listitem [ref=f45e3183]:
                  - text: In 1917, Hardy and Littlewood showed that the generalized Riemann hypothesis implies a conjecture of Chebyshev that
                  - math [ref=f45e3186]:
                    - generic [ref=f45e3189]:
                      - generic [ref=f45e3190]:
                        - generic [ref=f45e3191]: lim
                        - generic [ref=f45e3192]:
