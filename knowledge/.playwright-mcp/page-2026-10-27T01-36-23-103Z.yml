                - text: However this operator is not useful in practice since it includes the inverse function (implicit function) of the potential but not the potential itself. The analogy with the Riemann hypothesis over
                - link "finite fields" [ref=f45e4054] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Finite_field
                - text: suggests that the Hilbert space containing eigenvectors corresponding to the zeros might be some sort of first
                - link "cohomology group" [ref=f45e4055] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cohomology_group
                - text: of the
                - link "spectrum" [ref=f45e4056] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spectrum_of_a_ring
                - text: Spec (Z) of the integers.
                - link "Deninger (1998)" [ref=f45e4057] [cursor=pointer]:
                  - /url: "#CITEREFDeninger1998"
                - text: described some of the attempts to find such a cohomology theory.
                - superscript [ref=f45e4058]:
                  - link "[43]" [ref=f45e4059] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELeichtnam2005-43"
              - paragraph [ref=f45e4061]:
                - link "Zagier (1981)" [ref=f45e4062] [cursor=pointer]:
                  - /url: "#CITEREFZagier1981"
                - text: constructed a natural space of invariant functions on the upper half plane that has eigenvalues under the Laplacian operator that correspond to zeros of the Riemann zeta function—and remarked that in the unlikely event that one could show the existence of a suitable positive definite inner product on this space, the Riemann hypothesis would follow.
                - link "Cartier (1982)" [ref=f45e4063] [cursor=pointer]:
                  - /url: "#CITEREFCartier1982"
                - text: discussed a related example, where due to a bizarre bug a computer program listed zeros of the Riemann zeta function as eigenvalues of the same
                - link "Laplacian operator" [ref=f45e4064] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Laplacian_operator
                - text: .
              - paragraph [ref=f45e4065]:
                - link "Schumayer & Hutchinson (2011)" [ref=f45e4066] [cursor=pointer]:
                  - /url: "#CITEREFSchumayerHutchinson2011"
                - text: surveyed some of the attempts to construct a suitable physical model related to the Riemann zeta function.
