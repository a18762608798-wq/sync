              - text: improved this to one-third of the zeros by relating the zeros of the zeta function to those of its derivative, and
              - link "Conrey (1989)" [ref=f45e5310] [cursor=pointer]:
                - /url: "#CITEREFConrey1989"
              - text: improved this further to two-fifths. In 2020, this estimate was extended to five-twelfths (i.e., 41.6%) by Pratt, Robles,
              - link "Zaharescu" [ref=f45e5311] [cursor=pointer]:
