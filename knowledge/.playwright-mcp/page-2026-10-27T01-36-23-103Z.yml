                      - generic [ref=f45e3224]: +
                      - generic [ref=f45e3225]: ∞
                      - generic [ref=f45e3226]: ","
                  - text: which says that primes 3 mod 4 are more common than primes 1 mod 4 in some sense. (For related results, see
                  - link "Prime number theorem § Prime number race" [ref=f45e3229] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Prime_number_theorem#Prime_number_race
                  - text: .)
                - listitem [ref=f45e3230]:
                  - text: In 1923, Hardy and Littlewood showed that the generalized Riemann hypothesis implies a weak form of the
                  - link "Goldbach conjecture" [ref=f45e3231] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Goldbach_conjecture
                  - text: "for odd numbers: that every sufficiently large odd number is the sum of three primes, though in 1937 Vinogradov gave an unconditional proof. In 1997"
                  - link "Deshouillers" [ref=f45e3232] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Jean-Marc_Deshouillers
                  - text: ", Effinger,"
                  - link "te Riele" [ref=f45e3233] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Herman_te_Riele
                  - text: ", and Zinoviev showed that the generalized Riemann hypothesis implies that every odd number greater than 5 is the sum of three primes. In 2013"
                  - link "Harald Helfgott" [ref=f45e3234] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Harald_Helfgott
                  - text: proved the ternary Goldbach conjecture without the GRH dependence, subject to some extensive calculations completed with the help of David J. Platt.
                - listitem [ref=f45e3235]:
                  - text: In 1934, Chowla showed that the generalized Riemann hypothesis implies that the first prime in the arithmetic progression a mod m is at most Km
                  - superscript [ref=f45e3236]: "2"
                  - text: log(m)
                  - superscript [ref=f45e3237]: "2"
                  - text: for some fixed constant K.
                - listitem [ref=f45e3238]:
                  - text: In 1967, Hooley showed that the generalized Riemann hypothesis implies
                  - link "Artin's conjecture on primitive roots" [ref=f45e3239] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Artin's_conjecture_on_primitive_roots
                  - text: .
                - listitem [ref=f45e3240]:
                  - text: In 1973, Weinberger showed that the generalized Riemann hypothesis implies that Euler's list of
                  - link "idoneal numbers" [ref=f45e3241] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Idoneal_number
                  - text: is complete.
                - listitem [ref=f45e3242]:
                  - link "Weinberger (1973)" [ref=f45e3243] [cursor=pointer]:
                    - /url: "#CITEREFWeinberger1973"
                  - text: showed that the generalized Riemann hypothesis for the zeta functions of all algebraic number fields implies that any number field with class number 1 is either
                  - link "Euclidean" [ref=f45e3244] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Euclidean_domain
                  - text: or an imaginary quadratic number field of
                  - link "discriminant" [ref=f45e3245] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Discriminant_of_an_algebraic_number_field
                  - text: −19, −43, −67, or −163.
                - listitem [ref=f45e3246]:
                  - text: In 1976, G. Miller showed that the generalized Riemann hypothesis implies that one can
                  - link "test if a number is prime" [ref=f45e3247] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Primality_test
                  - text: in polynomial time via the
                  - link "Miller test" [ref=f45e3248] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Miller–Rabin_primality_test
                  - text: . In 2002, Manindra Agrawal, Neeraj Kayal and Nitin Saxena proved this result unconditionally using the
                  - link "AKS primality test" [ref=f45e3249] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/AKS_primality_test
                  - text: .
                - listitem [ref=f45e3250]:
                  - link "Odlyzko (1990)" [ref=f45e3251] [cursor=pointer]:
                    - /url: "#CITEREFOdlyzko1990"
                  - text: discussed how the generalized Riemann hypothesis can be used to give sharper estimates for discriminants and class numbers of number fields.
                - listitem [ref=f45e3252]:
                  - link "Ono & Soundararajan (1997)" [ref=f45e3253] [cursor=pointer]:
                    - /url: "#CITEREFOnoSoundararajan1997"
                  - text: showed that the generalized Riemann hypothesis implies that
                  - link "Ramanujan's integral quadratic form" [ref=f45e3254] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Ramanujan's_ternary_quadratic_form
                  - generic [ref=f45e3255]:
                    - text: x
                    - superscript [ref=f45e3256]: "2"
                    - text: + y
                    - superscript [ref=f45e3257]: "2"
                    - text: + 10z
                    - superscript [ref=f45e3258]: "2"
                  - text: represents all integers that it represents locally, with exactly 18 exceptions.
                - listitem [ref=f45e3259]:
                  - text: In 2021, Alexander (Alex) Dunn and
                  - link "Maksym Radziwill" [ref=f45e3260] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Maksym_Radziwill
                  - text: proved
                  - link "Patterson's conjecture" [ref=f45e3261] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Patterson's_conjecture?action=edit&redlink=1
                  - text: on cubic
                  - link "Gauss sums" [ref=f45e3262] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Gauss_sums
                  - text: ", under the assumption of the GRH."
