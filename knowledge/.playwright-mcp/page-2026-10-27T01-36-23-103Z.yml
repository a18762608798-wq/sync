              - paragraph [ref=f45e6455]:
                - text: A
                - link "Gram point" [ref=f45e6456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gram_point
                - text: is a point on the critical line 1/2 + it where the zeta function is real and non-zero. Using the expression for the zeta function on the critical line,
                - generic [ref=f45e6457]:
                  - text: ζ(1/2 + it) = Z(t)e
                  - superscript [ref=f45e6458]: −iθ(t)
                - text: ", where Hardy's function,"
                - link "Z" [ref=f45e6459] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Z_function
                - text: ", is real for real t, and θ is the"
                - link "Riemann–Siegel theta function" [ref=f45e6460] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Riemann–Siegel_theta_function
                - text: ", we see that zeta is real when"
                - generic [ref=f45e6461]: sin(θ(t)) = 0
                - text: . This implies that θ(t) is an integer multiple of π, which allows for the location of Gram points to be calculated fairly easily by inverting the formula for θ. They are usually numbered as
                - generic [ref=f45e6462]:
                  - text: g
                  - subscript [ref=f45e6463]: "n"
                - text: for n = 0, 1, ..., where
                - generic [ref=f45e6464]:
                  - text: g
                  - subscript [ref=f45e6465]: "n"
                - text: is the unique solution of
                - generic [ref=f45e6466]: θ(t) = nπ
                - text: .
              - paragraph [ref=f45e6467]:
                - text: Gram observed that there was often exactly one zero of the zeta function between any two consecutive Gram points; Hutchinson called this observation
                - link "Gram's law" [ref=f45e6469] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gram's_law
                - text: ". There are several other closely related statements that are also sometimes called Gram's law: for example,"
                - generic [ref=f45e6470]:
                  - text: (−1)
                  - superscript [ref=f45e6471]: "n"
                  - text: Z(
                  - generic [ref=f45e6472]:
                    - text: g
                    - subscript [ref=f45e6473]: "n"
                  - text: )
                - text: is usually positive, or Z(t) usually has opposite sign at consecutive Gram points. The imaginary parts
                - generic [ref=f45e6474]:
                  - text: γ
                  - subscript [ref=f45e6475]: "n"
                - text: of the first few zeros (in blue) and the first few Gram points
                - generic [ref=f45e6476]:
                  - text: g
                  - subscript [ref=f45e6477]: "n"
                - text: are given in the following table
