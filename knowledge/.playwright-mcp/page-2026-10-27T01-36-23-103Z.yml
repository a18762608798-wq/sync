                      - link "Titchmarsh (1936)" [ref=f45e6313] [cursor=pointer]:
                        - /url: "#CITEREFTitchmarsh1936"
                      - text: and L. J. Comrie were the last to find zeros by hand.
                  - row [ref=f45e6314]:
                    - cell "1953" [ref=f45e6315]
                    - cell "1104" [ref=f45e6316]
                    - cell [ref=f45e6317]:
                      - text: A. M.
                      - link "Turing (1953)" [ref=f45e6318] [cursor=pointer]:
                        - /url: "#CITEREFTuring1953"
                      - text: found a more efficient way to check that all zeros up to some point are accounted for by the zeros on the line, by checking that Z has the correct sign at several consecutive Gram points and using the fact that S(T) has average value 0. This requires almost no extra work because the sign of Z at Gram points is already known from finding the zeros, and is still the usual method used. This was the first use of a digital computer to calculate the zeros.
                  - row [ref=f45e6319]:
                    - cell "1956" [ref=f45e6320]
                    - cell "15000" [ref=f45e6321]
                    - cell [ref=f45e6323]:
                      - text: D. H.
                      - link "Lehmer (1956)" [ref=f45e6324] [cursor=pointer]:
                        - /url: "#CITEREFLehmer1956"
                      - text: "discovered a few cases where the zeta function has zeros that are \"only just\" on the line: two zeros of the zeta function are so close together that it is unusually difficult to find a sign change between them. This is called \"Lehmer's phenomenon\", and first occurs at the zeros with imaginary parts 7005.063 and 7005.101, which differ by only .04 while the average gap between other zeros near this point is about 1."
