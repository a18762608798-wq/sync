                  - superscript [ref=f45e4153]: −1/2+ε
                - text: for large N in the finite Dirichlet series above, would also imply the Riemann hypothesis, but
                - link "Montgomery (1983)" [ref=f45e4154] [cursor=pointer]:
                  - /url: "#CITEREFMontgomery1983"
                - text: showed that for all sufficiently large N these series have zeros with real part greater than
                - generic [ref=f45e4155]: 1 + (log log N)/(4 log N)
                - text: . Therefore, Turán's result is
                - link "vacuously true" [ref=f45e4156] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vacuous_truth
                - text: and cannot help prove the Riemann hypothesis.
            - region [ref=f45e4157]:
              - generic [ref=f45e4158]:
                - heading "Noncommutative geometry" [level=3] [ref=f45e4159]
                - link "edit" [ref=f45e4161] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=27
              - paragraph [ref=f45e4162]:
                - link "Alain Connes" [ref=f45e4163] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alain_Connes
                - text: has described a relationship between the Riemann hypothesis and
                - link "noncommutative geometry" [ref=f45e4164] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Noncommutative_geometry
                - text: ", and showed that a suitable analog of the"
                - link "Selberg trace formula" [ref=f45e4165] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_trace_formula
                - text: for the action of the
                - link "idèle class group" [ref=f45e4166] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Idèle_class_group
                - text: on the adèle class space would imply the Riemann hypothesis.
                - superscript [ref=f45e4167]:
                  - link "[46]" [ref=f45e4168] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - text: Some of these ideas are elaborated in
                - link "Lapidus (2008)" [ref=f45e4170] [cursor=pointer]:
                  - /url: "#CITEREFLapidus2008"
                - text: .
            - region [ref=f45e4171]:
              - generic [ref=f45e4172]:
                - heading "Hilbert spaces of entire functions" [level=3] [ref=f45e4173]
                - link "edit" [ref=f45e4175] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=28
              - paragraph [ref=f45e4176]:
                - link "Louis de Branges" [ref=f45e4177] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Louis_de_Branges_de_Bourcia
                - text: showed that the Riemann hypothesis would follow from a positivity condition on a certain
                - link "Hilbert space" [ref=f45e4178] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hilbert_space
                - text: of
                - link "entire functions" [ref=f45e4179] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Entire_function
                - text: .
                - superscript [ref=f45e4180]:
                  - link "[47]" [ref=f45e4181] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: However
                - link "Conrey & Li (2000)" [ref=f45e4183] [cursor=pointer]:
                  - /url: "#CITEREFConreyLi2000"
                - text: showed that the necessary positivity conditions are not satisfied. Despite this obstacle, de Branges has continued to work on an attempted proof of the Riemann hypothesis along the same lines, but this has not been widely accepted by other mathematicians.
                - superscript [ref=f45e4184]:
                  - link "[48]" [ref=f45e4185] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTESarnak2005-48"
            - region [ref=f45e4187]:
              - generic [ref=f45e4188]:
                - heading "Quasicrystals" [level=3] [ref=f45e4189]
                - link "edit" [ref=f45e4191] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=29
              - paragraph [ref=f45e4192]:
                - text: The Riemann hypothesis implies that the zeros of the zeta function form a
                - link "quasicrystal" [ref=f45e4193] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Quasicrystal
                - text: ", a distribution with discrete support whose"
                - link "Fourier transform" [ref=f45e4194] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fourier_transform
                - text: also has discrete support.
                - link "Dyson (2009)" [ref=f45e4195] [cursor=pointer]:
                  - /url: "#CITEREFDyson2009"
                - text: suggested trying to prove the Riemann hypothesis by classifying, or at least studying, 1-dimensional quasicrystals.
            - region [ref=f45e4196]:
              - generic [ref=f45e4197]:
                - heading "Arithmetic zeta functions of models of elliptic curves over number fields" [level=3] [ref=f45e4198]
                - link "edit" [ref=f45e4200] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=30
              - paragraph [ref=f45e4201]:
                - text: When one goes from geometric dimension one, e.g. an
                - link "algebraic number field" [ref=f45e4202] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Algebraic_number_field
                - text: ", to geometric dimension two, e.g. a regular model of an"
                - link "elliptic curve" [ref=f45e4203] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Elliptic_curve
                - text: over a number field, the two-dimensional part of the generalized Riemann hypothesis for the
                - link "arithmetic zeta function" [ref=f45e4204] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arithmetic_zeta_function
                - text: of the model deals with the poles of the zeta function. In dimension one the study of the zeta integral in
                - link "Tate's thesis" [ref=f45e4205] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tate's_thesis
                - text: does not lead to new important information on the Riemann hypothesis. Contrary to this, in dimension two work of
                - link "Ivan Fesenko" [ref=f45e4206] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ivan_Fesenko
                - text: on two-dimensional generalisation of Tate's thesis includes an integral representation of a zeta integral closely related to the zeta function. In this new situation, not possible in dimension one, the poles of the zeta function can be studied via the zeta integral and associated adele groups. Related conjecture of
                - link "Ivan Fesenko" [ref=f45e4207] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ivan_Fesenko
                - text: on the positivity of the fourth derivative of a boundary function associated to the zeta integral essentially implies the pole part of the generalized Riemann hypothesis.
                - superscript [ref=f45e4208]:
                  - link "[49]" [ref=f45e4209] [cursor=pointer]:
                    - /url: "#cite_note-49"
                - text: Suzuki (
                - link "2011" [ref=f45e4211] [cursor=pointer]:
                  - /url: "#CITEREFSuzuki2011"
                - text: ) proved that the latter, together with some technical assumptions, implies Fesenko's conjecture.
            - region [ref=f45e4212]:
              - generic [ref=f45e4213]:
                - heading "Multiple zeta functions" [level=3] [ref=f45e4214]
                - link "edit" [ref=f45e4216] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=31
              - paragraph [ref=f45e4217]:
                - text: Deligne's proof of the Riemann hypothesis over finite fields used the zeta functions of product varieties, whose zeros and poles correspond to sums of zeros and poles of the original zeta function, in order to bound the real parts of the zeros of the original zeta function. By analogy,
                - link "Kurokawa (1992)" [ref=f45e4218] [cursor=pointer]:
                  - /url: "#CITEREFKurokawa1992"
                - text: introduced multiple zeta functions whose zeros and poles correspond to sums of zeros and poles of the Riemann zeta function. To make the series converge he restricted to sums of zeros or poles all with non-negative imaginary part. So far, the known bounds on the zeros and poles of the multiple zeta functions are not strong enough to give useful estimates for the zeros of the Riemann zeta function.
