                    - generic [ref=f45e3975]: .
                - text: This yields a Hamiltonian whose eigenvalues are the square of the imaginary part of the Riemann zeros, and also that the
                - link "functional determinant" [ref=f45e3977] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Functional_determinant
                - text: of this
                - link "Hamiltonian operator" [ref=f45e3978] [cursor=pointer]:
