                - text: . So far all zeros that have been checked are on the critical line and are simple. (A multiple zero would cause problems for the zero finding algorithms, which depend on finding sign changes between zeros.) For tables of the zeros, see
                - link "Haselgrove & Miller (1960)" [ref=f45e6265] [cursor=pointer]:
                  - /url: "#CITEREFHaselgroveMiller1960"
                - text: or
                - link "Odlyzko" [ref=f45e6266] [cursor=pointer]:
                  - /url: "#CITEREFOdlyzko"
                - text: .
