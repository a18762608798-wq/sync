            - region [ref=f45e3598]:
              - generic [ref=f45e3599]:
                - heading "Dirichlet L-series and other number fields" [level=3] [ref=f45e3600]
                - link "edit" [ref=f45e3602] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=16
              - paragraph [ref=f45e3603]:
                - text: The Riemann hypothesis can be generalized by replacing the Riemann zeta function by the formally similar, but much more general, global
                - link "L-functions" [ref=f45e3604] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/L-function
                - text: . In this broader setting, one expects the non-trivial zeros of the global L-functions to have real part 1/2. It is these conjectures, rather than the classical Riemann hypothesis only for the single Riemann zeta function, which account for the true importance of the Riemann hypothesis in mathematics.
              - paragraph [ref=f45e3605]:
                - text: The most common
                - link "generalized Riemann hypothesis" [ref=f45e3606] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Generalized_Riemann_hypothesis
                - text: extends the Riemann hypothesis to all
                - link "Dirichlet L-functions" [ref=f45e3607] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dirichlet_L-function
                - text: . In particular it implies the conjecture that
                - link "Siegel zeros" [ref=f45e3608] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Siegel_zero
                - text: (zeros of L-functions between 1/2 and 1) do not exist.
              - paragraph [ref=f45e3609]:
                - text: The
                - link "extended Riemann hypothesis" [ref=f45e3610] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Extended_Riemann_hypothesis
                - text: extends the Riemann hypothesis to all
                - link "Dedekind zeta functions" [ref=f45e3611] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dedekind_zeta_function
                - text: of
                - link "algebraic number fields" [ref=f45e3612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Algebraic_number_field
                - text: . Since Dedekind zeta function for abelian extension of the rationals can be expressed as product of Dirichlet L-functions and only possible pole is in 1 for Riemann zeta function (thus no pole can cancel nontrivial zero), this version of Riemann hypothesis implies generalized Riemann hypothesis.
              - paragraph [ref=f45e3613]:
                - text: The Riemann hypothesis can also be extended to the L-functions of
                - link "Hecke characters" [ref=f45e3614] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hecke_character
                - text: of number fields. Since Dirichlet L-functions are Hecke L-functions for finite characters, then this hypothesis directly implies generalized Riemann hypothesis. Dedekind zeta functions can be expressed as product of Hecke L-functions and only possible pole of Hecke L-function is at 1, then this version of Riemann Hypothesis implies also version for Dedekind zeta functions.
              - paragraph [ref=f45e3615]:
                - text: There are two approaches for extension of Riemann hypothesis that seem to be the most general. The
                - link "grand Riemann hypothesis" [ref=f45e3616] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Grand_Riemann_hypothesis
                - text: extends it to all
                - link "Automorphic L-functions" [ref=f45e3617] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Automorphic_L-function
                - text: ", such as"
                - link "Mellin transforms" [ref=f45e3618] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mellin_transform
                - text: of
                - link "Hecke eigenforms" [ref=f45e3619] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hecke_eigenform
                - text: . The Riemann hypothesis for
                - link "Selberg class" [ref=f45e3620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_class
                - text: extends it rather for functions satisfying some properties (at least conjecturaly satisfied by most functions usually called zeta functions or L-functions) than for functions defined by direct formula. Though it is expected that Selberg class should be equal to class of automorphic L-functions, and thus this approaches should be equivalent, this is important open problem itself and part of
                - link "Langlands program" [ref=f45e3621] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Langlands_program
                - text: .
            - region [ref=f45e3622]:
