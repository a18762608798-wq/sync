                - text: is just the
                - link "Riemann Xi function" [ref=f45e3979] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Riemann_Xi_function
                - text: . In fact the Riemann Xi function would be proportional to the functional determinant (
                - link "Hadamard product" [ref=f45e3980] [cursor=pointer]:
