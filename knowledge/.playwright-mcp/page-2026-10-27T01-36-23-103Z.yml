                - text: . This is in contrast to
                - link "canonical quantization" [ref=f45e3879] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Canonical_quantization
                - text: ", which leads to the"
                - link "Heisenberg uncertainty principle" [ref=f45e3880] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Heisenberg_uncertainty_principle
                - math [ref=f45e3883]:
