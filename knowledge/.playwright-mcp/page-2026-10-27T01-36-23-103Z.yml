                            - generic [ref=f45e3197]: −
                      - generic [ref=f45e3199]:
                        - generic [ref=f45e3200]: ∑
                        - generic [ref=f45e3201]:
                          - generic [ref=f45e3202]: p
                          - generic [ref=f45e3203]: ">"
                          - generic [ref=f45e3204]: "2"
                      - generic [ref=f45e3205]: (
                      - generic [ref=f45e3206]: −
                      - generic [ref=f45e3207]: "1"
                      - generic [ref=f45e3208]:
