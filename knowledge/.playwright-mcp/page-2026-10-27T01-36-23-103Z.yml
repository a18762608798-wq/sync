                    - cell [ref=f45e6304]:
                      - text: E. C.
                      - link "Titchmarsh (1935)" [ref=f45e6305] [cursor=pointer]:
                        - /url: "#CITEREFTitchmarsh1935"
                      - text: used the recently rediscovered
                      - link "Riemann–Siegel formula" [ref=f45e6306] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Riemann–Siegel_formula
                      - text: ", which is much faster than Euler–Maclaurin summation. It takes about O(T"
                      - superscript [ref=f45e6307]: 3/2 + ε
                      - text: ) steps to check zeros with imaginary part less than T, while the Euler–Maclaurin method takes about O(T
                      - superscript [ref=f45e6308]: 2 + ε
                      - text: ) steps.
                  - row [ref=f45e6309]:
