                    - generic [ref=f45e3719]: "1"
                    - generic [ref=f45e3720]: ","
                    - generic [ref=f45e3721]: "2"
                    - generic [ref=f45e3722]: ","
                    - generic [ref=f45e3723]: …
                    - generic [ref=f45e3724]: ","
                    - generic [ref=f45e3725]: "n"
                    - generic [ref=f45e3726]: −
                    - generic [ref=f45e3727]: "1"
                - text: . This is known for schemes in positive characteristic and follows from Pierre Deligne
                - superscript [ref=f45e3729]:
                  - link "[40]" [ref=f45e3730] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - text: ", but remains entirely unknown in characteristic zero."
            - region [ref=f45e3732]:
              - generic [ref=f45e3733]:
                - heading "Selberg zeta functions" [level=3] [ref=f45e3734]
                - link "edit" [ref=f45e3736] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=19
              - note [ref=f45e3737]:
                - text: "Main article:"
                - link "Selberg zeta function" [ref=f45e3738] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_zeta_function
              - paragraph [ref=f45e3739]:
                - link "Selberg (1956)" [ref=f45e3740] [cursor=pointer]:
                  - /url: "#CITEREFSelberg1956"
                - text: introduced the
                - link "Selberg zeta function" [ref=f45e3741] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_zeta_function
                - text: "of a Riemann surface. These are similar to the Riemann zeta function: they have a functional equation, and an infinite product similar to the Euler product but taken over closed geodesics rather than primes. The"
                - link "Selberg trace formula" [ref=f45e3742] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_trace_formula
                - text: is the analogue for these functions of the
                - link "explicit formulas" [ref=f45e3743] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Explicit_formula_(L-function)
                - text: in prime number theory. Selberg proved that the Selberg zeta functions satisfy the analogue of the Riemann hypothesis, with the imaginary parts of their zeros related to the
                - link "eigenvalues" [ref=f45e3744] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eigenvalue
                - text: of the Laplacian operator of the Riemann surface.
            - region [ref=f45e3745]:
              - generic [ref=f45e3746]:
                - heading "Ihara zeta functions" [level=3] [ref=f45e3747]
                - link "edit" [ref=f45e3749] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=20
              - paragraph [ref=f45e3750]:
                - text: The
                - link "Ihara zeta function" [ref=f45e3751] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ihara_zeta_function
                - text: of a finite graph is an analogue of the
                - link "Selberg zeta function" [ref=f45e3752] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_zeta_function
                - text: ", which was first introduced by"
                - link "Yasutaka Ihara" [ref=f45e3753] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Yasutaka_Ihara
                - text: in the context of discrete subgroups of the two-by-two p-adic special linear group. A regular finite graph is a
                - link "Ramanujan graph" [ref=f45e3754] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ramanujan_graph
                - text: ", a mathematical model of efficient communication networks, if and only if its Ihara zeta function satisfies the analogue of the Riemann hypothesis as was pointed out by"
                - link "T. Sunada" [ref=f45e3755] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Toshikazu_Sunada
                - text: .
            - region [ref=f45e3756]:
              - generic [ref=f45e3757]:
                - heading "Montgomery's pair correlation conjecture" [level=3] [ref=f45e3758]
                - link "edit" [ref=f45e3760] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=21
              - paragraph [ref=f45e3761]:
                - link "Montgomery (1973)" [ref=f45e3762] [cursor=pointer]:
                  - /url: "#CITEREFMontgomery1973"
                - text: suggested the
                - link "pair correlation conjecture" [ref=f45e3763] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pair_correlation_conjecture
                - text: that the correlation functions of the (suitably normalized) zeros of the zeta function should be the same as those of the eigenvalues of a
                - link "random hermitian matrix" [ref=f45e3764] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gaussian_unitary_ensemble
                - text: .
                - link "Odlyzko (1987)" [ref=f45e3765] [cursor=pointer]:
                  - /url: "#CITEREFOdlyzko1987"
                - text: showed that this is supported by large-scale numerical calculations of these correlation functions.
              - paragraph [ref=f45e3766]:
                - text: Montgomery showed that (assuming the Riemann hypothesis) at least 2/3 of all zeros are simple, and a related conjecture is that all zeros of the zeta function are simple (or more generally have no non-trivial integer linear relations between their imaginary parts).
                - link "Dedekind zeta functions" [ref=f45e3767] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dedekind_zeta_function
                - text: of algebraic number fields, which generalize the Riemann zeta function, often do have multiple complex zeros.
                - superscript [ref=f45e3768]:
                  - link "[41]" [ref=f45e3769] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTERadziejewski2007-41"
                - text: This is because the Dedekind zeta functions factorize as a product of powers of
                - link "Artin L-functions" [ref=f45e3771] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Artin_L-function
                - text: ", so zeros of Artin L-functions sometimes give rise to multiple zeros of Dedekind zeta functions. Other examples of zeta functions with multiple zeros are the L-functions of some"
                - link "elliptic curves" [ref=f45e3772] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Elliptic_curve
                - text: ": these can have multiple zeros at the real point of their critical line; the"
                - link "Birch-Swinnerton-Dyer conjecture" [ref=f45e3773] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Birch-Swinnerton-Dyer_conjecture
                - text: predicts that the multiplicity of this zero is the rank of the elliptic curve.
            - region [ref=f45e3774]:
              - generic [ref=f45e3775]:
                - heading "Other zeta functions" [level=3] [ref=f45e3776]
                - link "edit" [ref=f45e3778] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=22
              - paragraph [ref=f45e3779]:
                - text: There are
                - link "many other examples" [ref=f45e3780] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zeta_function
                - text: of zeta functions with analogues of the Riemann hypothesis, some of which have been proved.
                - link "Goss zeta functions" [ref=f45e3781] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Goss_zeta_function
                - text: of function fields have a Riemann hypothesis, proved by
                - link "Sheats (1998)" [ref=f45e3782] [cursor=pointer]:
                  - /url: "#CITEREFSheats1998"
                - text: .
                - link "The main conjecture" [ref=f45e3783] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Main_conjecture_of_Iwasawa_theory
                - text: of
                - link "Iwasawa theory" [ref=f45e3784] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iwasawa_theory
                - text: ", proved by"
                - link "Barry Mazur" [ref=f45e3785] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Barry_Mazur
                - text: and
                - link "Andrew Wiles" [ref=f45e3786] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andrew_Wiles
                - text: for
                - link "cyclotomic fields" [ref=f45e3787] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cyclotomic_field
                - text: ", and Wiles for"
                - link "totally real fields" [ref=f45e3788] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Totally_real_number_field
                - text: ", identifies the zeros of a p-adic L-function with the eigenvalues of an operator, so can be thought of as an analogue of the"
                - link "Hilbert–Pólya conjecture" [ref=f45e3789] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hilbert–Pólya_conjecture
                - text: for
                - link "p-adic L-functions" [ref=f45e3790] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/P-adic_L-function
                - text: .
                - superscript [ref=f45e3791]:
                  - link "[42]" [ref=f45e3792] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEWiles2000-42"
          - region [ref=f45e3794]:
            - generic [ref=f45e3795]:
              - heading "Attempted proofs" [level=2] [ref=f45e3796]
              - link "edit" [ref=f45e3798] [cursor=pointer]:
                - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=23
            - paragraph [ref=f45e3799]:
              - text: Several mathematicians have addressed the Riemann hypothesis, but none of their attempts has yet been accepted as a proof.
              - link "Watkins (2021)" [ref=f45e3800] [cursor=pointer]:
                - /url: "#CITEREFWatkins2021"
              - text: lists some incorrect solutions.
            - region [ref=f45e3801]:
              - generic [ref=f45e3802]:
                - heading "Operator theory" [level=3] [ref=f45e3803]
                - link "edit" [ref=f45e3805] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=24
              - note [ref=f45e3806]:
                - text: "Main article:"
                - link "Hilbert–Pólya conjecture" [ref=f45e3807] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hilbert–Pólya_conjecture
              - paragraph [ref=f45e3808]:
                - text: Hilbert and Pólya suggested that one way to derive the Riemann hypothesis would be to find a
                - link "self-adjoint operator" [ref=f45e3809] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Self-adjoint_operator
                - text: ", from the existence of which the statement on the real parts of the zeros of ζ(s) would follow when one applies the criterion on real"
                - link "eigenvalues" [ref=f45e3810] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eigenvalue
                - text: ". Some support for this idea comes from several analogues of the Riemann zeta functions whose zeros correspond to eigenvalues of some operator: the zeros of a zeta function of a variety over a finite field correspond to eigenvalues of a"
                - link "Frobenius element" [ref=f45e3811] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Frobenius_element
                - text: on an
                - link "étale cohomology" [ref=f45e3812] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Étale_cohomology
                - text: group, the zeros of a
                - link "Selberg zeta function" [ref=f45e3813] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_zeta_function
                - text: are eigenvalues of a
                - link "Laplacian operator" [ref=f45e3814] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Laplacian_operator
                - text: of a Riemann surface, and the zeros of a
                - link "p-adic zeta function" [ref=f45e3815] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/P-adic_zeta_function
                - text: correspond to eigenvectors of a Galois action on
                - link "ideal class groups" [ref=f45e3816] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ideal_class_group
                - text: .
              - paragraph [ref=f45e3817]:
                - link "Odlyzko (1987)" [ref=f45e3818] [cursor=pointer]:
                  - /url: "#CITEREFOdlyzko1987"
                - text: showed that the distribution of the zeros of the Riemann zeta function shares some statistical properties with the eigenvalues of
                - link "random matrices" [ref=f45e3819] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Random_matrices
                - text: drawn from the
                - link "Gaussian unitary ensemble" [ref=f45e3820] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gaussian_unitary_ensemble
                - text: . This gives some support to the
                - link "Hilbert–Pólya conjecture" [ref=f45e3821] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hilbert–Pólya_conjecture
                - text: .
              - paragraph [ref=f45e3822]:
                - text: In 1999,
                - link "Michael Berry" [ref=f45e3823] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Michael_Berry_(physicist)
                - text: and
                - link "Jonathan Keating" [ref=f45e3824] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jonathan_Keating
                - text: conjectured that there is some unknown quantization
                - math [ref=f45e3827]:
