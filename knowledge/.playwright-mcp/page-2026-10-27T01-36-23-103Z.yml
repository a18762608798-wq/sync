                - text: and the
                - link "natural numbers" [ref=f45e3901] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Natural_numbers
                - text: as spectrum of the
                - link "quantum harmonic oscillator" [ref=f45e3902] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Quantum_harmonic_oscillator
                - text: . The crucial point is that the Hamiltonian should be a self-adjoint operator so that the quantization would be a realization of the Hilbert–Pólya program. In a connection with this quantum mechanical problem Berry and Connes had proposed that the inverse of the potential of the Hamiltonian is connected to the
                - link "half-derivative" [ref=f45e3903] [cursor=pointer]:
