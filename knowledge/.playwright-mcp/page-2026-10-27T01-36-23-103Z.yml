              - paragraph [ref=f45e6571]:
                - text: A Gram point t is called good if the zeta function is positive at
                - generic [ref=f45e6572]: 1/2 + it
                - text: . The indices of the "bad" Gram points where Z has the "wrong" sign are 126, 134, 195, 211, ... (sequence
                - link "A114856" [ref=f45e6574] [cursor=pointer]:
                  - /url: //oeis.org/A114856
                - text: in the
                - link "OEIS" [ref=f45e6575] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/On-Line_Encyclopedia_of_Integer_Sequences
                - text: ). A Gram block is an interval bounded by two good Gram points such that all the Gram points between them are bad. A refinement of Gram's law called Rosser's rule due to
                - link "Rosser, Yohe & Schoenfeld (1969)" [ref=f45e6576] [cursor=pointer]:
                  - /url: "#CITEREFRosserYoheSchoenfeld1969"
                - text: says that Gram blocks often have the expected number of zeros in them (the same as the number of Gram intervals), even though some of the individual Gram intervals in the block may not have exactly one zero in them. For example, the interval bounded by g
                - subscript [ref=f45e6577]: "125"
                - text: and g
                - subscript [ref=f45e6578]: "127"
                - text: is a Gram block containing a unique bad Gram point g
                - subscript [ref=f45e6579]: "126"
                - text: ", and contains the expected number 2 of zeros although neither of its two Gram intervals contains a unique zero. Rosser et al. checked that there were no exceptions to Rosser's rule in the first 3 million zeros, although there are infinitely many exceptions to Rosser's rule over the entire zeta function."
              - paragraph [ref=f45e6580]:
                - text: "Gram's rule and Rosser's rule both say that in some sense zeros do not stray too far from their expected positions. The distance of a zero from its expected position is controlled by the function S defined above, which grows extremely slowly: its average value is of the order of (log log T)"
                - superscript [ref=f45e6581]: 1/2
                - text: ", which only reaches 2 for T around 10"
                - superscript [ref=f45e6582]: "24"
                - text: . This means that both rules hold most of the time for small T but eventually break down often. Indeed,
                - link "Trudgian (2011)" [ref=f45e6583] [cursor=pointer]:
                  - /url: "#CITEREFTrudgian2011"
                - text: showed that both Gram's law and Rosser's rule fail in a positive proportion of cases. To be specific, it is expected that in about 66% one zero is enclosed by two successive Gram points, but in 17% no zero and in 17% two zeros are in such a Gram-interval on the long run
                - link "Hanga (2020)" [ref=f45e6584] [cursor=pointer]:
                  - /url: "#CITEREFHanga2020"
                - text: .
            - region [ref=f45e6585]:
              - generic [ref=f45e6586]:
                - heading "Random matrix theory and quantum chaos" [level=3] [ref=f45e6587]
                - link "edit" [ref=f45e6589] [cursor=pointer]:
                  - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=41
              - paragraph [ref=f45e6590]:
                - text: Assuming the Riemann hypothesis one can ask what further regularities might govern the distribution of the zeros of the zeta function on the critical line. One conjectural picture is that the critical zeros of the zeta function behave statistically like the eigenvalues of large random
                - link "Hermitian matrices" [ref=f45e6591] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hermitian_matrix
                - text: . The idea began with
                - link "Hugh Montgomery" [ref=f45e6592] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hugh_Montgomery_(mathematician)
                - text: "'s work on the"
                - link "pair correlation conjecture" [ref=f45e6593] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pair_correlation_conjecture
                - text: for the zeros of the zeta function.
                - superscript [ref=f45e6594]:
                  - link "[65]" [ref=f45e6595] [cursor=pointer]:
                    - /url: "#cite_note-65"
                - text: After a suitable rescaling to account for the increasing density of zeros with height, the conjectured pair correlation function agrees with that of
                - link "eigenvalues" [ref=f45e6597] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eigenvalue
                - text: in the
                - link "Gaussian unitary ensemble" [ref=f45e6598] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gaussian_unitary_ensemble
                - text: (GUE) in random matrix theory.
                - superscript [ref=f45e6599]:
                  - link "[66]" [ref=f45e6600] [cursor=pointer]:
                    - /url: "#cite_note-66"
                - superscript [ref=f45e6602]:
                  - link "[67]" [ref=f45e6603] [cursor=pointer]:
                    - /url: "#cite_note-67"
              - paragraph [ref=f45e6605]:
                - text: The connection was tested numerically by
                - link "Andrew Odlyzko" [ref=f45e6606] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andrew_Odlyzko
                - text: ", who found that the spacing statistics of zeros high on the critical line agree closely with the predictions of GUE random matrix theory."
                - superscript [ref=f45e6607]:
                  - link "[68]" [ref=f45e6608] [cursor=pointer]:
                    - /url: "#cite_note-68"
                - superscript [ref=f45e6610]:
                  - link "[69]" [ref=f45e6611] [cursor=pointer]:
                    - /url: "#cite_note-69"
                - text: The agreement extends beyond nearest-neighbor spacings to higher correlation functions, and is widely regarded as strong evidence that the zeros are modeled by the same local statistics as random matrices.
                - superscript [ref=f45e6613]:
                  - link "[70]" [ref=f45e6614] [cursor=pointer]:
                    - /url: "#cite_note-70"
                - superscript [ref=f45e6616]:
                  - link "[71]" [ref=f45e6617] [cursor=pointer]:
                    - /url: "#cite_note-71"
              - paragraph [ref=f45e6619]:
                - text: The random matrix analogy is also related to the Hilbert–Pólya conjecture, and to ideas from
                - link "quantum chaos" [ref=f45e6620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Quantum_chaos
                - text: . In quantum chaotic systems, eigenvalues often obey random matrix statistics, so the appearance of the same statistics in the zeros of the zeta function can be interpreted as evidence that they may arise from a selfadjoint operator or from a chaotic dynamical system.
                - superscript [ref=f45e6621]:
                  - link "[72]" [ref=f45e6622] [cursor=pointer]:
                    - /url: "#cite_note-72"
                - superscript [ref=f45e6624]:
                  - link "[73]" [ref=f45e6625] [cursor=pointer]:
                    - /url: "#cite_note-73"
                - text: This gives a heuristic picture of why the zeros might lie on a spectral line and why their spacings exhibit strong repulsion rather than random clustering.
                - superscript [ref=f45e6627]:
                  - link "[74]" [ref=f45e6628] [cursor=pointer]:
                    - /url: "#cite_note-74"
              - paragraph [ref=f45e6630]:
                - text: This viewpoint was adopted by
                - link "Nicholas Katz" [ref=f45e6631] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nicholas_Katz
                - text: and
                - link "Peter Sarnak" [ref=f45e6632] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Peter_Sarnak
                - text: ", who proposed that families of"
                - link "L-functions" [ref=f45e6633] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/L-function
                - text: have symmetry types governed by the compact
                - link "classical groups" [ref=f45e6634] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Classical_group
                - text: (
                - link "unitary" [ref=f45e6635] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Unitary_group
                - text: ","
                - link "orthogonal" [ref=f45e6636] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Orthogonal_group
                - text: ", or"
                - link "symplectic" [ref=f45e6637] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Symplectic_group
                - text: ), and that the distributions of their low-lying zeros should match the corresponding random-matrix ensembles.
                - superscript [ref=f45e6638]:
                  - link "[75]" [ref=f45e6639] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - superscript [ref=f45e6641]:
                  - link "[76]" [ref=f45e6642] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - superscript [ref=f45e6644]:
                  - link "[77]" [ref=f45e6645] [cursor=pointer]:
                    - /url: "#cite_note-77"
                - text: For the Riemann zeta function, the relevant ensemble is that of the unitary group. Random matrix theory has also led to conjectures about the growth of moments of the zeta function on the critical line. In particular,
                - link "Jonathan Keating" [ref=f45e6647] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jonathan_Keating
                - text: and
                - link "Nina Snaith" [ref=f45e6648] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nina_Snaith
                - text: used averages over random unitary matrices to predict the main constants in asymptotic moment formulas such as
                - math [ref=f45e6651]:
                  - generic [ref=f45e6654]:
                    - generic [ref=f45e6656]:
                      - generic [ref=f45e6657]: "1"
                      - generic [ref=f45e6658]: T
                    - generic [ref=f45e6659]:
                      - generic [ref=f45e6660]: ∫
                      - generic [ref=f45e6661]: "0"
                      - generic [ref=f45e6663]: T
                    - generic [ref=f45e6665]: "|"
                    - generic [ref=f45e6667]: ζ
                    - generic [ref=f45e6668]: (
                    - generic [ref=f45e6669]: "1"
                    - generic [ref=f45e6670]: /
                    - generic [ref=f45e6672]: "2"
                    - generic [ref=f45e6673]: +
                    - generic [ref=f45e6674]: i
                    - generic [ref=f45e6675]: t
                    - generic [ref=f45e6676]: )
                    - generic [ref=f45e6677]:
                      - generic [ref=f45e6678]: "|"
                      - generic [ref=f45e6680]:
                        - generic [ref=f45e6681]: "2"
                        - generic [ref=f45e6682]: k
                    - generic [ref=f45e6683]: d
                    - generic [ref=f45e6684]: t
                - text: as
                - math [ref=f45e6688]:
                  - generic [ref=f45e6691]:
                    - generic [ref=f45e6692]: T
                    - generic [ref=f45e6693]: →
                    - generic [ref=f45e6694]: ∞
                - text: . Their conjectures separate a universal random-matrix factor from an arithmetic
                - link "Euler product" [ref=f45e6696] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Euler_product
                - text: factor, and have influenced later work on moments and ratios of L-functions.
                - superscript [ref=f45e6697]:
                  - link "[78]" [ref=f45e6698] [cursor=pointer]:
                    - /url: "#cite_note-78"
                - superscript [ref=f45e6700]:
                  - link "[79]" [ref=f45e6701] [cursor=pointer]:
                    - /url: "#cite_note-79"
                - superscript [ref=f45e6703]:
                  - link "[80]" [ref=f45e6704] [cursor=pointer]:
                    - /url: "#cite_note-80"
          - region [ref=f45e6706]:
            - generic [ref=f45e6707]:
              - heading "Arguments for and against the Riemann hypothesis" [level=2] [ref=f45e6708]
              - link "edit" [ref=f45e6710] [cursor=pointer]:
                - /url: /w/index.php?title=Riemann_hypothesis&action=edit&section=42
            - paragraph [ref=f45e6711]:
              - text: Mathematical papers about the Riemann hypothesis tend to be cautiously noncommittal about its truth. Of authors who express an opinion, most of them, such as
              - link "Riemann (1859)" [ref=f45e6712] [cursor=pointer]:
                - /url: "#CITEREFRiemann1859"
              - text: and
              - link "Bombieri (2000)" [ref=f45e6713] [cursor=pointer]:
                - /url: "#CITEREFBombieri2000"
              - text: ", imply that they expect (or at least hope) that it is true. The few authors who express serious doubt about it include"
              - link "Ivić (2008)" [ref=f45e6714] [cursor=pointer]:
                - /url: "#CITEREFIvić2008"
              - text: ", who lists some reasons for skepticism, and"
              - link "Littlewood (1962)" [ref=f45e6715] [cursor=pointer]:
                - /url: "#CITEREFLittlewood1962"
              - text: ", who flatly states that he believes it false, that there is no evidence for it and no imaginable reason it would be true. The consensus of the survey articles ("
              - link "Bombieri 2000" [ref=f45e6716] [cursor=pointer]:
                - /url: "#CITEREFBombieri2000"
              - text: ","
              - link "Conrey 2003" [ref=f45e6717] [cursor=pointer]:
                - /url: "#CITEREFConrey2003"
              - generic [ref=f45e6718]:
                - text: "harvnb error: multiple targets (2×): CITEREFConrey2003 ("
                - link "help" [ref=f45e6719] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Category:Harv_and_Sfn_template_errors
                - text: )
              - text: ", and"
              - link "Sarnak 2005" [ref=f45e6720] [cursor=pointer]:
                - /url: "#CITEREFSarnak2005"
              - text: ) is that the evidence for it is strong but not overwhelming, so that while it is probably true there is reasonable doubt.
            - paragraph [ref=f45e6721]:
              - text: Some of the arguments for and against the Riemann hypothesis are listed by
              - link "Conrey (2003)" [ref=f45e6722] [cursor=pointer]:
                - /url: "#CITEREFConrey2003"
              - generic [ref=f45e6723]:
                - text: "harvtxt error: multiple targets (2×): CITEREFConrey2003 ("
                - link "help" [ref=f45e6724] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Category:Harv_and_Sfn_template_errors
                - text: )
              - text: ","
              - link "Sarnak (2005)" [ref=f45e6725] [cursor=pointer]:
                - /url: "#CITEREFSarnak2005"
              - text: ", and"
              - link "Ivić (2008)" [ref=f45e6726] [cursor=pointer]:
                - /url: "#CITEREFIvić2008"
              - text: ", and include the following:"
            - list [ref=f45e6727]:
              - listitem [ref=f45e6728]:
                - text: Several analogues of the Riemann hypothesis have already been proved. The proof of the Riemann hypothesis for varieties over finite fields by
                - link "Deligne (1974)" [ref=f45e6729] [cursor=pointer]:
                  - /url: "#CITEREFDeligne1974"
                - text: is possibly the single strongest theoretical reason in favor of the Riemann hypothesis. This provides some evidence for the more general conjecture that all zeta functions associated with
                - link "automorphic" [ref=f45e6730] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Automorphic_form
                - text: forms satisfy a Riemann hypothesis, which includes the classical Riemann hypothesis as a special case. Similarly
                - link "Selberg zeta functions" [ref=f45e6731] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Selberg_zeta_function
                - text: satisfy the analogue of the Riemann hypothesis, and are in some ways similar to the Riemann zeta function, having a functional equation and an infinite product expansion analogous to the Euler product expansion. But there are also some major differences; for example, they are not given by Dirichlet series. The Riemann hypothesis for the
                - link "Goss zeta function" [ref=f45e6732] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Goss_zeta_function
                - text: was proved by
                - link "Sheats (1998)" [ref=f45e6733] [cursor=pointer]:
                  - /url: "#CITEREFSheats1998"
                - text: . In contrast to these positive examples, some
                - link "Epstein zeta functions" [ref=f45e6734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Epstein_zeta_function
                - text: do not satisfy the Riemann hypothesis even though they have an infinite number of zeros on the critical line.
                - superscript [ref=f45e6735]:
                  - link "[17]" [ref=f45e6736] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTETitchmarsh1986-17"
                - text: These functions are quite similar to the Riemann zeta function, and have a Dirichlet series expansion and a
                - link "functional equation" [ref=f45e6738] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Functional_equation_(L-function)
                - text: ", but the ones known to fail the Riemann hypothesis do not have an"
                - link "Euler product" [ref=f45e6739] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Euler_product
                - text: and are not directly related to
                - link "automorphic representations" [ref=f45e6740] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Automorphic_representation
                - text: .
              - listitem [ref=f45e6741]:
                - text: At first, the numerical verification that many zeros lie on the line seems strong evidence for it. But analytic number theory has had many conjectures supported by substantial numerical evidence that turned out to be false. See
                - link "Skewes number" [ref=f45e6742] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skewes_number
                - text: for a notorious example, where the first exception to a plausible conjecture related to the Riemann hypothesis probably occurs around 10
                - superscript [ref=f45e6743]: "316"
                - text: ; a counterexample to the Riemann hypothesis with imaginary part this size would be far beyond anything that can currently be computed using a direct approach. The problem is that the behavior is often influenced by very slowly increasing functions such as log log T, that tend to infinity, but do so so slowly that this cannot be detected by computation. Such functions occur in the theory of the zeta function controlling the behavior of its zeros; for example the function S(T) above has average size around (log log T)
                - superscript [ref=f45e6744]: 1/2
                - text: . As S(T) jumps by at least 2 at any counterexample to the Riemann hypothesis, one might expect any counterexamples to the Riemann hypothesis to start appearing only when S(T) becomes large. It is never much more than 3 as far as it has been calculated, but is known to be unbounded, suggesting that calculations may not have yet reached the region of typical behavior of the zeta function.
              - listitem [ref=f45e6745]:
                - link "Denjoy" [ref=f45e6746] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arnaud_Denjoy
                - text: "'s probabilistic argument for the Riemann hypothesis"
                - superscript [ref=f45e6747]:
                  - link "[81]" [ref=f45e6748] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEEdwards1974-81"
                - text: is based on the observation that if μ(x) is a random sequence of "1"s and "−1"s then, for every
                - generic [ref=f45e6750]: ε > 0
                - text: ", the"
                - link "partial sums" [ref=f45e6751] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Partial_sum
                - math [ref=f45e6754]:
                  - generic [ref=f45e6757]:
                    - generic [ref=f45e6758]: M
                    - generic [ref=f45e6759]: (
                    - generic [ref=f45e6760]: x
                    - generic [ref=f45e6761]: )
                    - generic [ref=f45e6762]: =
                    - generic [ref=f45e6763]:
                      - generic [ref=f45e6764]: ∑
                      - generic [ref=f45e6765]:
                        - generic [ref=f45e6766]: "n"
                        - generic [ref=f45e6767]: ≤
                        - generic [ref=f45e6768]: x
                    - generic [ref=f45e6769]: μ
                    - generic [ref=f45e6770]: (
                    - generic [ref=f45e6771]: "n"
                    - generic [ref=f45e6772]: )
                - text: (the values of which are positions in a
                - link "simple random walk" [ref=f45e6774] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Simple_random_walk
                - text: ) satisfy the bound
                - math [ref=f45e6777]:
                  - generic [ref=f45e6780]:
                    - generic [ref=f45e6781]: M
                    - generic [ref=f45e6782]: (
                    - generic [ref=f45e6783]: x
                    - generic [ref=f45e6784]: )
                    - generic [ref=f45e6785]: =
                    - generic [ref=f45e6786]: O
                    - generic [ref=f45e6787]: (
                    - generic [ref=f45e6788]:
                      - generic [ref=f45e6789]: x
                      - generic [ref=f45e6790]:
                        - generic [ref=f45e6791]: "1"
                        - generic [ref=f45e6792]: /
                        - generic [ref=f45e6794]: "2"
                        - generic [ref=f45e6795]: +
                        - generic [ref=f45e6796]: ε
                    - generic [ref=f45e6797]: )
                - text: with
                - link "probability 1" [ref=f45e6799] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Almost_surely
                - text: . The Riemann hypothesis is equivalent to this bound for the
                - link "Möbius function" [ref=f45e6800] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Möbius_function
                - text: μ and the
                - link "Mertens function" [ref=f45e6801] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mertens_function
                - text: M derived in the same way from it. In other words, the Riemann hypothesis is in some sense equivalent to saying that μ(x) behaves like a random sequence of coin tosses. When μ(x) is nonzero its sign gives the
                - link "parity" [ref=f45e6802] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Parity_(mathematics)
                - text: of the number of prime factors of x, so informally the Riemann hypothesis says that the parity of the number of prime factors of an integer behaves randomly. Such probabilistic arguments in number theory often give the right answer, but tend to be very hard to make rigorous, and occasionally give the wrong answer for some results, such as
                - link "Maier's theorem" [ref=f45e6803] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maier's_theorem
                - text: .
              - listitem [ref=f45e6804]:
                - text: The calculations in
                - link "Odlyzko (1987)" [ref=f45e6805] [cursor=pointer]:
                  - /url: "#CITEREFOdlyzko1987"
                - text: show that the zeros of the zeta function behave very much like the eigenvalues of a random
                - link "Hermitian matrix" [ref=f45e6806] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hermitian_matrix
                - text: ", suggesting that they are the eigenvalues of some self-adjoint operator, which would imply the Riemann hypothesis. All attempts to find such an operator have failed."
              - listitem [ref=f45e6807]:
                - text: There are several theorems, such as
                - link "Goldbach's weak conjecture" [ref=f45e6808] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Goldbach's_weak_conjecture
                - text: for sufficiently large odd numbers, that were first proved using the generalized Riemann hypothesis, and later shown to be true unconditionally. This could be considered as weak evidence for the generalized Riemann hypothesis, as several of its "predictions" are true.
              - listitem [ref=f45e6809]:
                - link "Lehmer's phenomenon" [ref=f45e6810] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lehmer_pair
                - text: ","
                - superscript [ref=f45e6811]:
                  - link "[82]" [ref=f45e6812] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELehmer1956-82"
                - text: where two zeros are sometimes very close, is sometimes given as a reason to disbelieve the Riemann hypothesis. But one would expect this to happen occasionally by chance even if the Riemann hypothesis is true, and Odlyzko's calculations suggest that nearby pairs of zeros occur just as often as predicted by
                - link "Montgomery's conjecture" [ref=f45e6814] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Montgomery's_pair_correlation_conjecture
                - text: .
              - listitem [ref=f45e6815]:
                - link "Patterson" [ref=f45e6816] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Samuel_James_Patterson
                - text: suggests that the most compelling reason for the Riemann hypothesis for most mathematicians is the hope that primes are distributed as regularly as possible.
                - superscript [ref=f45e6817]:
                  - link "[83]" [ref=f45e6818] [cursor=pointer]:
                    - /url: "#cite_note-83"
          - region [ref=f45e6820]:
