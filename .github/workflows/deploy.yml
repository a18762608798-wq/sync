name: Deploy Slidev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: computer/code/notebook/markdown/slidev/workspace/basic-case/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: computer/code/notebook/markdown/slidev/workspace/basic-case
        run: pnpm install --frozen-lockfile

      - name: Build Slidev
        working-directory: computer/code/notebook/markdown/slidev/workspace/basic-case
        run: pnpm build --base /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: computer/code/notebook/markdown/slidev/workspace/basic-case/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
