name: Deploy Slidev

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            computer/code/notebook/markdown/slidev/workspace/basic-case/pnpm-lock.yaml
            computer/code/notebook/markdown/slidev/workspace/genshin-impact/2026-7-26/pnpm-lock.yaml
            computer/code/notebook/markdown/slidev/workspace/group_meeting/2026-7-30/pnpm-lock.yaml

      - name: Install basic-case dependencies
        working-directory: computer/code/notebook/markdown/slidev/workspace/basic-case
        run: pnpm install --frozen-lockfile

      - name: Install genshin-impact dependencies
        working-directory: computer/code/notebook/markdown/slidev/workspace/genshin-impact/2026-7-26
        run: pnpm install --frozen-lockfile

      - name: Install group_meeting 2026-7-30 dependencies
        working-directory: computer/code/notebook/markdown/slidev/workspace/group_meeting/2026-7-30
        run: pnpm install --frozen-lockfile

      - name: Clean output directory
        run: rm -rf computer/code/notebook/markdown/slidev/workspace/workspace-dist

      - name: Build basic-case
        working-directory: computer/code/notebook/markdown/slidev/workspace/basic-case
        run: >
          pnpm build
          --base /${{ github.event.repository.name }}/basic-case/
          --out ../workspace-dist/basic-case

      - name: Build genshin-impact
        working-directory: computer/code/notebook/markdown/slidev/workspace/genshin-impact/2026-7-26
        run: >
          pnpm build
          --base /${{ github.event.repository.name }}/genshin-impact/2026-7-26/
          --out ../../workspace-dist/genshin-impact/2026-7-26

      - name: Build group_meeting 2026-7-30
        working-directory: computer/code/notebook/markdown/slidev/workspace/group_meeting/2026-7-30
        run: >
          pnpm build
          --base /${{ github.event.repository.name }}/group_meeting/2026-7-30/
          --out ../../workspace-dist/group_meeting/2026-7-30

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: computer/code/notebook/markdown/slidev/workspace/workspace-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
